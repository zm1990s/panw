version: "3.8"

# 后端部署：mcp-server + api-service
# 使用 .env.backend 配置环境变量

services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    env_file: .env.backend
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    env_file: .env.backend
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api-service:8080
      - REQUIRE_PORTKEY_CLAIMS=${REQUIRE_PORTKEY_CLAIMS:-true}
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
