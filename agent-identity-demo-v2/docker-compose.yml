version: "3.8"

services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api-service:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent-web:
    build:
      context: .
      dockerfile: Dockerfile.agent
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORTKEY_API_KEY=${PORTKEY_API_KEY}
      - PORTKEY_MCP_URL=${PORTKEY_MCP_URL}
      - PORTKEY_LLM_URL=${PORTKEY_LLM_URL}
      - PORTKEY_LLM_MODEL=${PORTKEY_LLM_MODEL}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: python agent_backend.py
