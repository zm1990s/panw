<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Matrix Index</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020604;
  --green:#00ff88;
  --green-soft:#37ffb0;
  --green-dim:#0b8f55;
  --cyan:#52faff;
  --line:rgba(0,255,136,.28);
  --panel:rgba(0,18,10,.68);
  --text:#d8ffe9;
  --muted:#73b894;
}
html,body{height:100%}
body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;
  color:var(--text);
  background:#000;
}
#matrix{
  position:fixed;
  inset:0;
  z-index:0;
  display:block;
  width:100%;
  height:100%;
  opacity:1;
}
.scanline{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
  opacity:.12;
}
.wrap{
  position:relative;
  z-index:2;
  height:100vh;
  overflow:auto;
  padding:42px clamp(20px,5vw,72px);
}
.shell{
  width:min(1120px,100%);
  margin:0 auto;
}
.hero{
  display:grid;
  grid-template-columns:1fr auto;
  gap:22px;
  align-items:end;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
}
.eyebrow{
  color:var(--green);
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-shadow:0 0 12px rgba(0,255,136,.72);
}
h1{
  margin-top:10px;
  font-size:clamp(34px,7vw,76px);
  line-height:.95;
  letter-spacing:0;
  color:#edfff5;
  text-shadow:0 0 18px rgba(0,255,136,.35),0 0 34px rgba(82,250,255,.16);
}
.subtitle{
  margin-top:14px;
  max-width:720px;
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
}
.status{
  min-width:188px;
  border:1px solid var(--line);
  background:rgba(0,14,8,.62);
  box-shadow:0 0 24px rgba(0,255,136,.12),inset 0 0 22px rgba(0,255,136,.04);
  padding:14px 16px;
}
.status b{
  display:block;
  font-size:34px;
  line-height:1;
  color:var(--green-soft);
  text-shadow:0 0 16px rgba(0,255,136,.5);
}
.status span{
  display:block;
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
  margin-top:28px;
}
.card{
  position:relative;
  display:flex;
  min-height:176px;
  flex-direction:column;
  justify-content:space-between;
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--line);
  background:
    linear-gradient(145deg,rgba(0,255,136,.12),transparent 34%),
    linear-gradient(180deg,rgba(0,25,13,.78),rgba(0,10,5,.74));
  box-shadow:0 0 0 1px rgba(0,255,136,.04),0 18px 42px rgba(0,0,0,.48),inset 0 0 30px rgba(0,255,136,.04);
  padding:20px;
  overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.card:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(82,250,255,.16),transparent);
  transform:translateX(-120%);
  transition:transform .55s ease;
}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(82,250,255,.76);
  background:
    linear-gradient(145deg,rgba(82,250,255,.16),transparent 34%),
    linear-gradient(180deg,rgba(0,32,18,.82),rgba(0,12,7,.78));
  box-shadow:0 0 24px rgba(0,255,136,.18),0 22px 48px rgba(0,0,0,.52),inset 0 0 36px rgba(82,250,255,.05);
}
.card:hover:before{transform:translateX(120%)}
.card-top{position:relative;z-index:1}
.card-id{
  font-size:11px;
  color:var(--cyan);
  letter-spacing:.14em;
  text-transform:uppercase;
}
.card h2{
  margin-top:14px;
  font-size:22px;
  line-height:1.3;
  letter-spacing:0;
}
.card p{
  margin-top:12px;
  color:var(--muted);
  line-height:1.65;
  font-size:13px;
}
.card-bottom{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:22px;
  padding-top:14px;
  border-top:1px solid rgba(0,255,136,.16);
}
.file{
  min-width:0;
  overflow:hidden;
  color:#94ffd0;
  font-size:12px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.open{
  flex-shrink:0;
  color:#00180c;
  background:var(--green);
  border:1px solid rgba(216,255,233,.6);
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  box-shadow:0 0 18px rgba(0,255,136,.35);
}
.footer{
  margin-top:28px;
  color:#4f8f70;
  font-size:11px;
  line-height:1.7;
}
@media (max-width:760px){
  body{overflow:auto}
  .wrap{height:auto;min-height:100vh;padding:28px 16px}
  .hero{grid-template-columns:1fr}
  .status{width:100%;min-width:0}
  .card{min-height:164px}
}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="scanline" aria-hidden="true"></div>

<main class="wrap">
  <section class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow">Local HTML Directory</div>
        <h1>Matrix Index</h1>
        <p class="subtitle">同目录 HTML 文件索引。点击任意方块进入对应页面，背景数字雨会随窗口尺寸自动重绘。</p>
      </div>
      <div class="status">
        <b id="count">2</b>
        <span>HTML entries online</span>
      </div>
    </header>

    <section class="grid" id="grid" aria-label="HTML file index"></section>

    <p class="footer">Manifest generated from the current directory. Static browser pages cannot enumerate local folders by themselves; update this file when adding new HTML pages.</p>
  </section>
</main>

<script>
const pages = [
  {
    file: 'zt-architect.html',
    title: '零信任网络安全架构',
    desc: '交互式零信任架构设计器，支持模块选择、高亮、PIN 和 PNG 导出。'
  },
  {
    file: 'idira_flow.html',
    title: 'IDIRA Identity Flow',
    desc: 'IDIRA 与 Entra ID Federation 身份流程可视化页面。'
  },
  {
    file: 'homelab.html',
    title: 'Zero Trust Homelab',
    desc: '可编辑 Homelab 拓扑规划器，支持节点、区域、连线、Tag 和 PNG 导出。'
  }
];

const grid = document.getElementById('grid');
document.getElementById('count').textContent = pages.length;
grid.innerHTML = pages.map((p, i) => `
  <a class="card" href="${p.file}">
    <div class="card-top">
      <div class="card-id">NODE ${String(i + 1).padStart(2, '0')}</div>
      <h2>${p.title}</h2>
      <p>${p.desc}</p>
    </div>
    <div class="card-bottom">
      <span class="file">${p.file}</span>
      <span class="open">OPEN</span>
    </div>
  </a>
`).join('');

const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let width = 0;
let height = 0;
let columns = 0;
let drops = [];
let speeds = [];
let tick = null;
const charSize = 16;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  columns = Math.floor(width / charSize);
  drops = Array.from({ length: columns }, () => Math.floor(Math.random() * -80));
  speeds = Array.from({ length: columns }, () => 0.65 + Math.random() * 1.7);
  ctx.font = `${charSize}px Arial, sans-serif`;
  ctx.textBaseline = 'top';
}

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = 'rgba(0,255,0,0.42)';
  ctx.shadowBlur = 0;
  for (let i = 0; i < drops.length; i++) {
    const text = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 33));
    ctx.fillText(text, i * charSize, drops[i] * charSize);

    drops[i] += speeds[i];
    if (Math.random() > 0.992) {
      speeds[i] = 0.65 + Math.random() * 1.7;
    }

    if (drops[i] * charSize > height && Math.random() > 0.975) {
      drops[i] = 0;
      speeds[i] = 0.65 + Math.random() * 1.7;
    }
  }
}

window.addEventListener('resize', resize);
resize();
tick = setInterval(draw, 33);
</script>
</body>
</html>
