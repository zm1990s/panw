<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>零信任网络安全架构 — 交互式设计器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:#0d1424;color:#e2e8f0;display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:13px}

/* TOP BAR */
#top{background:#111827;border-bottom:1px solid #1e3a5f;padding:7px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0}
#top .ptitle{font-size:11px;color:#475569;font-weight:700;white-space:nowrap;margin-right:4px}
.pbadge{background:#0d1424;border:1px solid #1e3a5f;border-radius:20px;padding:2px 9px;font-size:10px;color:#64748b;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.top-toggle{border:1px solid #334155;background:#0d1424;color:#94a3b8;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s}
.top-toggle:hover{background:#1e293b;color:#e2e8f0}
.top-toggle.active{background:#0e7490;border-color:#22d3ee;color:#ecfeff}

/* BODY ROW */
#body-row{flex:1;display:flex;overflow:hidden}

/* SIDEBAR */
#sidebar{width:256px;flex-shrink:0;background:#111827;border-right:1px solid #1e3a5f;display:flex;flex-direction:column;overflow:hidden}
#sb-head{padding:10px 14px 8px;border-bottom:1px solid #1e3a5f;flex-shrink:0}
#sb-head h2{font-size:12px;font-weight:700;color:#38bdf8;margin-bottom:8px}
.preset-row{display:flex;gap:5px;flex-wrap:wrap}
.btn-preset{padding:3px 8px;border-radius:4px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:10px;cursor:pointer;transition:all .15s}
.btn-preset:hover{background:#334155;color:#e2e8f0}
.btn-preset.active{background:#1d4ed8;border-color:#2563eb;color:#fff}
.sbtn-row{display:flex;gap:5px;margin-top:8px}
.btn-sm{padding:4px 10px;border-radius:4px;border:none;font-size:11px;cursor:pointer;font-weight:500;transition:all .15s}
.btn-all{background:#1d4ed8;color:#fff}.btn-all:hover{background:#2563eb}
.btn-reset{background:#334155;color:#cbd5e1}.btn-reset:hover{background:#475569}
#sb-body{flex:1;overflow-y:auto;padding:8px 10px}
#sb-body::-webkit-scrollbar{width:3px}
#sb-body::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}

.sg{margin-bottom:10px}
.sg-hdr{display:flex;align-items:center;gap:6px;padding:4px 3px;cursor:pointer;border-radius:4px;transition:background .15s;user-select:none}
.sg-hdr:hover{background:#1e293b}
.sg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sg-lbl{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
.sg-cnt{margin-left:auto;font-size:9px;color:#334155}
.sg-arrow{font-size:9px;color:#475569;transition:transform .2s}
.sg-arrow.open{transform:rotate(90deg)}
.gcb{cursor:pointer;flex-shrink:0;margin:0 2px;width:12px;height:12px;accent-color:#6366f1}
.sg-items{padding-left:2px;overflow:hidden;max-height:0;transition:max-height .2s ease}
.sg-items.open{max-height:500px}
.cb-row{display:flex;align-items:flex-start;gap:6px;padding:3px 5px;cursor:pointer;border-radius:3px;transition:background .15s}
.cb-row:hover{background:#1e293b}
.cb-row input{width:12px;height:12px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0;margin-top:1px}
.cb-lbl{font-size:11px;color:#64748b;cursor:pointer;line-height:1.3}
.cb-row.checked .cb-lbl{color:#cbd5e1}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* CANVAS */
#cv-wrap{flex:1;overflow:auto;padding:12px;background:#0d1424}
#cv-wrap::-webkit-scrollbar{height:5px;width:5px}
#cv-wrap::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
#canvas-outer{display:flex;flex-direction:column;gap:8px;position:relative;min-width:fit-content}
#canvas-mid{display:flex;gap:22px;min-height:420px;align-items:stretch}
#conn-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:20}
/* BANDS */
.band{display:flex;flex-direction:column;gap:5px}
.band-hdr{border-radius:5px;padding:5px 16px;font-size:9px;font-weight:700;text-align:center;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
#band-top .band-hdr{background:rgba(11,20,60,0.55);border:1px solid rgba(29,78,216,0.5);color:#60a5fa}
#band-bot .band-hdr{background:rgba(20,83,45,0.18);border:1px solid rgba(74,222,128,0.45);color:#4ade80}
.band-body{display:flex;flex-direction:row;gap:12px;align-items:flex-start}
.band-body .col-sec-col{flex:0 0 auto;min-width:170px;max-width:220px}
.band-body .col-section-v{flex:none}
.band-body>.mod{flex:0 0 auto;min-width:150px;max-width:200px}
.col-sec-col.col-sec-wide{flex:0 0 auto}
.col-section.col-section-2col{display:grid;grid-template-columns:repeat(2,minmax(140px,auto));gap:10px;flex:unset}
.band-top-row{display:flex;flex-direction:row;gap:8px;align-items:stretch}
.band-top-row>#band-top{flex:0 0 auto}
#band-topright .band-hdr{background:rgba(8,35,50,.55);border:1px solid rgba(8,145,178,.5);color:#22d3ee}
#band-top,#band-bot{align-self:flex-start}
.sec-controls-wrap{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.sec-controls-hdr{background:#111827;border:1px solid #1e3a5f;border-radius:5px;padding:4px 16px;font-size:9px;font-weight:700;color:#475569;text-align:center;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
.sec-controls-grid{display:grid;grid-template-columns:max-content max-content;gap:10px;align-items:start}
.sec-controls-grid>.col{justify-self:start}
#band-bot .col-section-v,#band-top .col-section-v,#band-topright .col-section-v{display:flex;flex-direction:row;flex-wrap:wrap;gap:5px;align-items:flex-start}
#band-bot .col-section-v>.mod,#band-top .col-section-v>.mod,#band-topright .col-section-v>.mod{flex:0 0 auto;min-width:140px;max-width:none}
#band-bot .band-body .col-sec-col,#band-top .band-body .col-sec-col,#band-topright .band-body .col-sec-col{max-width:none}
[data-sec-group].hidden{display:none}

/* COLUMNS */
.col{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.col-body{display:flex;flex-direction:column;gap:12px}
.col-hdr{background:#111827;border:1px solid #1e3a5f;border-radius:5px;padding:5px 8px;font-size:9px;font-weight:700;color:#475569;text-align:center;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
#col-8 .col-hdr,#col-9 .col-hdr{background:rgba(20,83,45,0.2);border-color:rgba(74,222,128,0.35);color:#4ade80}
#col-0 .col-hdr,#col-4 .col-hdr,#col-2 .col-hdr{background:rgba(109,40,217,0.2);border-color:rgba(167,139,250,0.35);color:#a78bfa}
#col-3 .col-hdr{background:rgba(180,83,9,0.2);border-color:rgba(251,191,36,0.35);color:#fbbf24}
#col-6 .col-hdr{background:rgba(159,18,57,0.2);border-color:rgba(251,113,133,0.35);color:#fb7185}
.col-sub-hdr{border-radius:4px;padding:3px 8px;font-size:9px;font-weight:700;text-align:center;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;margin-top:1px;background:rgba(14,116,144,0.15);border:1px solid rgba(14,116,144,0.4);color:#22d3ee}
.col-sub-hdr.human  {background:rgba(109,40,217,0.15);border-color:rgba(109,40,217,0.45);color:#a78bfa}
.col-sub-hdr.machine{background:rgba(8,145,178,0.15); border-color:rgba(8,145,178,0.45); color:#22d3ee}
.col-sub-hdr.aiagent{background:rgba(217,119,6,0.15); border-color:rgba(217,119,6,0.45);  color:#fbbf24}
.col-sub-hdr.subj   {background:rgba(29,78,216,0.15); border-color:rgba(29,78,216,0.45);   color:#60a5fa}
.col-sub-hdr.cmp{background:rgba(20,83,45,0.18);border-color:rgba(74,222,128,0.45);color:#4ade80}
.col-sub-hdr.rsrc{background:rgba(8,145,178,0.15); border-color:rgba(8,145,178,0.45); color:#22d3ee}
.col-sub-hdr.sasewarm{background:rgba(180,83,9,0.16);border-color:rgba(251,191,36,0.45);color:#fbbf24}
.col-sub-hdr.asec{background:rgba(159,18,57,0.15);border-color:rgba(251,113,133,0.45);color:#fb7185}
.col-section{display:flex;flex-direction:column;gap:10px;border:1px solid rgba(14,116,144,0.12);border-radius:5px;padding:8px;background:rgba(4,40,48,0.45);flex:1}
.col-sec-row{display:flex;flex-direction:row;gap:10px;align-self:flex-start}
.col-sec-row.col-sec-stack{flex-direction:column}
.col-sec-row.col-sec-stack>.col-sec-col{width:100%}
.col-sec-row.col-sec-stack .col-section{width:100%}
.col-sec-row.col-sec-stack .col-section.col-section-2col{grid-template-columns:repeat(2,minmax(132px,1fr))}
.col-sec-col{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;min-width:0}

/* MODULES */
.mod{border-radius:7px;padding:11px 13px;border:1px solid;transition:opacity .18s,box-shadow .18s,max-height .25s;position:relative;overflow:hidden}
.mod.hidden{display:none}
.mod.dimmed{opacity:0.13}
.mod.hovered{box-shadow:0 0 0 2px #93c5fd,0 0 16px rgba(147,197,253,0.4)}
.mod.related{box-shadow:0 0 0 1.5px rgba(255,255,255,0.22)}
#col-3 .mod{padding:8px 10px}
#col-3 .mod-lbl{font-size:10.5px;margin-bottom:0}
#col-3 .mod-items{display:none}
body.sase-detail #col-3 .mod{padding:11px 13px}
body.sase-detail #col-3 .mod-lbl{font-size:11px;margin-bottom:5px}
body.sase-detail #col-3 .mod-items{display:flex}
#conn-svg g.conn-grp{transition:opacity .18s}
#conn-svg g.conn-dim{opacity:0.05}
#conn-svg g.conn-bright path{stroke-width:2.8px !important;opacity:0.85 !important}
#conn-svg g.conn-bright polygon{opacity:1 !important}
.col-sub-hdr.hidden{display:none}
[id^="sec-"].sec-hl>.col-sub-hdr{box-shadow:0 0 0 1.5px rgba(147,197,253,0.5);color:#93c5fd}
.mod-lbl{font-size:11px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:1.3}
.mod-items{display:flex;flex-direction:column;gap:2px}
.mod-item{font-size:10px;color:#475569;padding:1px 5px;background:rgba(0,0,0,.3);border-radius:3px;line-height:1.4}

/* COLOR THEMES */
.t-subj{background:#0c1a35;border-color:#1d4ed8}.t-subj .mod-lbl{color:#60a5fa}
.t-idnt{background:#170d35;border-color:#6d28d9}.t-idnt .mod-lbl{color:#a78bfa}
.t-human{background:#170d35;border-color:#6d28d9}.t-human .mod-lbl{color:#a78bfa}
.t-mach{background:#031920;border-color:#0e7490}.t-mach .mod-lbl{color:#22d3ee}
.t-agent{background:#1a1105;border-color:#d97706}.t-agent .mod-lbl{color:#fbbf24}
.t-accs{background:#0c1a2a;border-color:#0369a1}.t-accs .mod-lbl{color:#38bdf8}
.t-sase{background:#1f1305;border-color:#b45309}.t-sase .mod-lbl{color:#fbbf24}
.t-rsrc{background:#042830;border-color:#0e7490}.t-rsrc .mod-lbl{color:#22d3ee}
.t-ai  {background:#1f1205;border-color:#92400e}.t-ai   .mod-lbl{color:#fbbf24}
.t-asec{background:#1f0510;border-color:#9f1239}.t-asec .mod-lbl{color:#fb7185}
.t-ops {background:#0f0f20;border-color:#3730a3}.t-ops  .mod-lbl{color:#818cf8}
.t-cmp {background:#031a0d;border-color:#14532d}.t-cmp  .mod-lbl{color:#4ade80}

/* VERTICAL SECTION GROUPS */
.sec-group{display:flex;flex-direction:column;gap:4px}
.sec-group.hidden{display:none}
.col-section-v{display:flex;flex-direction:column;gap:8px;border:1px solid rgba(14,116,144,0.2);border-radius:5px;padding:8px;background:rgba(4,40,48,0.3)}
.col-section-v.human  {border-color:rgba(109,40,217,0.35);background:rgba(23,13,53,0.25)}
.col-section-v.machine{border-color:rgba(8,145,178,0.3)}
.col-section-v.aiagent{border-color:rgba(217,119,6,0.35);background:rgba(26,17,5,0.25)}
.col-section-v.cmp{border-color:rgba(74,222,128,0.35);background:rgba(3,26,13,0.25)}
.col-section-v.rsrc{border-color:rgba(8,145,178,0.3)}
.col-section-v.sasewarm{border-color:rgba(251,191,36,0.35);background:rgba(31,19,5,0.25)}

/* CHANNEL TAGS */
.ctag{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:8px;font-weight:800;flex-shrink:0}
.ctag-A{background:#dc2626;color:#fff}
.ctag-B{background:#d97706;color:#fff}
.ctag-C{background:#16a34a;color:#fff}

/* VERIFICATION STRIP (inside SASE column) */
.verif-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;padding:7px 8px;background:rgba(14,116,144,0.08);border:1px solid rgba(14,116,144,0.25);border-radius:5px;margin-top:2px}
.verif-strip-hdr{grid-column:1/-1;font-size:9px;font-weight:700;color:#0e7490;text-align:center;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.vid{background:#0c1a35;border:2px solid #1d4ed8;border-radius:5px;padding:4px 7px;min-width:0;width:100%;font-size:9px;font-weight:800;color:#60a5fa;text-align:center;white-space:nowrap;cursor:default;transition:opacity .18s,box-shadow .18s,border-color .18s,color .18s}
.vid-dem{background:#1a1105;border-color:#d97706;color:#fbbf24}
.vid.hidden{display:none}
.vid.dimmed{opacity:0.13}
.vid.hovered{box-shadow:0 0 0 2px #93c5fd,0 0 16px rgba(147,197,253,0.4)}
.vid.related{box-shadow:0 0 0 1.5px rgba(255,255,255,0.22)}
body.sase-detail #col-3 .verif-strip{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));align-items:stretch}
body.sase-detail #col-3 .verif-strip .vid{padding:8px 10px;display:flex;align-items:center;justify-content:center}

/* STATS BAR */
#stats{background:#111827;border-top:1px solid #1e3a5f;padding:5px 16px;display:flex;gap:20px;font-size:10px;color:#334155;flex-shrink:0;align-items:center}
.stat{display:flex;gap:4px;align-items:center}
.stat b{color:#38bdf8;font-weight:700}

/* TOOLTIP */
#tip{position:fixed;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:8px 12px;font-size:11px;color:#e2e8f0;pointer-events:none;z-index:999;max-width:240px;display:none;line-height:1.4;box-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>
<body>

<div id="top">
  <span class="ptitle" data-i18n="principlesTitle">设计原则 →</span>
  <span class="pbadge" data-i18n="principleIdentity">身份优先</span>
  <span class="pbadge" data-i18n="principleUnified">人 / Agent / Workload 同一治理</span>
  <span class="pbadge" data-i18n="principleContinuous">持续验证</span>
  <span class="pbadge" data-i18n="principleControl">统一控制面</span>
  <span class="pbadge" data-i18n="principleOpen">开放协作</span>
  <span class="pbadge" data-i18n="principleGlobal">全球一致 · 区域合规</span>
  <span class="pbadge" data-i18n="principleObservable">可观测 · 可审计</span>
  <div class="top-actions">
    <button id="export-selected" class="top-toggle" type="button" data-i18n="exportSelected">导出已选</button>
    <button id="export-highlight" class="top-toggle" type="button" data-i18n="exportHighlight">导出高亮</button>
    <button id="export-all" class="top-toggle" type="button" data-i18n="exportAll">导出全部</button>
    <button id="lang-toggle" class="top-toggle" type="button" aria-label="Switch language">EN</button>
    <button id="sase-detail-toggle" class="top-toggle" type="button" aria-pressed="false">显示网络安全详情</button>
  </div>
</div>

<div id="body-row">
  <div id="sidebar">
    <div id="sb-head">
      <h2 data-i18n="appTitle">零信任架构设计器</h2>
      <div class="preset-row" id="presets"></div>
      <div class="sbtn-row">
        <button class="btn-sm btn-all" onclick="selectAll()" data-i18n="selectAll">全选</button>
        <button class="btn-sm btn-reset" onclick="resetAll()" data-i18n="resetAll">清空</button>
      </div>
    </div>
    <div id="sb-body"></div>
  </div>

  <div id="main">
    <div id="cv-wrap">
      <div id="canvas-outer">
        <svg id="conn-svg"></svg>
      </div>
    </div>
    <div id="stats">
      <div class="stat"><span data-i18n="statMods">已启用模块</span>: <b id="s-mods">0</b></div>
      <div class="stat"><span data-i18n="statConns">活跃连接</span>: <b id="s-conns">0</b></div>
      <div class="stat"><span data-i18n="statIdent">身份类型</span>: <b id="s-ident">0</b></div>
      <div class="stat"><span data-i18n="statRes">资源域</span>: <b id="s-res">0</b></div>
      <div class="stat" style="margin-left:auto;color:#475569;font-size:9px" data-i18n="hint">悬停查看说明 · 勾选组件构建架构</div>
    </div>
  </div>
</div>

<div id="tip"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────────────────────

const PRESETS = [
  { id:'p-small',  label:'小型企业',  mods:['m-emp','m-endpointdev','m-sso','m-epm','m-device','m-remote','m-sase-mu','m-atp','m-aurl','m-adns','m-awf','m-internet','m-saas','m-policy'] },
  { id:'p-mid',    label:'中型企业',  mods:['m-emp','m-contractor','m-endpointdev','m-aiagent','m-sso','m-pam','m-itdr','m-epm','m-xdr','m-nbsc','m-device','m-agtreg','m-redteam','m-mcpauth','m-remote','m-branch','m-campus','m-byod','m-sase-mu','m-sase-ep', 'm-sase-rn', 'm-sase-sc', 'm-sase-browser', 'm-atp','m-awf','m-aurl','m-adns','m-devsec','m-swmesh','m-edlp','m-ai-access','m-internet','m-saas','m-cloud','m-dc','m-llmgw','m-mcpgw','m-cspm','m-dspm','m-cwpp','m-policy', 'm-alert','m-expomgmt', 'm-compliance'] },
  { id:'p-large',  label:'大型跨国',  mods:['m-emp','m-contractor','m-endpointdev','m-iot','m-aiagent','m-sso','m-pam','m-itdr','m-epm','m-xdr','m-nbsc','m-device','m-agtreg','m-mcpauth','m-spiffe','m-wcert','m-remote','m-branch','m-campus','m-byod','m-sase-mu','m-sase-ep','m-sase-browser','m-sase-rn','m-sase-sc','m-atp','m-awf','m-aurl','m-adns','m-devsec','m-swmesh','m-ipdef','m-edlp','m-saas-sec','m-ngcasb','m-ai-access','m-atpp','m-internet','m-saas','m-cloud','m-dc','m-llmgw','m-mcpgw','m-rtsec','m-modelsec','m-skillsec','m-cspm','m-dspm','m-cwpp','m-attackpath','m-ciem','m-cdr','m-aspm','m-aispm','m-policy','m-alert','m-log','m-compliance','m-xpanse','m-expomgmt','m-xsiam','m-xsoar','m-agentix'] },
 ];

const GROUPS = [
  { id:'g-subj',  label:'身份主体',   color:'#1d4ed8', mods:['m-emp','m-contractor','m-aiagent'] },
  { id:'g-dev',   label:'设备',       color:'#0369a1', mods:['m-endpointdev','m-byod','m-iot'] },
  { id:'g-idnt',  label:'人类身份',   color:'#1d4ed8', mods:['m-sso','m-pam','m-itdr'] },
  { id:'g-epd',   label:'终端安全',   color:'#14532d', mods:['m-epm','m-xdr','m-nbsc','m-device'] },
  { id:'g-aiid',  label:'AI Agent 身份', color:'#d97706', mods:['m-agtreg','m-mcpauth'] },
  { id:'g-mach',  label:'机器身份',   color:'#0891b2', mods:['m-spiffe','m-wcert'] },

const state = { enabled: new Set(), activePreset: null, lang: 'zh', pinnedHighlight: null };

function trUI(key) { return I18N[state.lang]?.ui?.[key] || I18N.zh.ui[key] || key; }
function trPreset(p) { return I18N[state.lang]?.presets?.[p.id] || p.label; }
function trGroup(g) { return I18N[state.lang]?.groups?.[g.id] || g.label; }
function trCol(cd) { return I18N[state.lang]?.cols?.[cd.id] || cd.label; }
function trSec(sec) { return I18N[state.lang]?.secs?.[sec] || sec; }
function trMod(mid, m) {
  const tx = I18N[state.lang]?.mods?.[mid] || {};
  return { label: tx.label || m.label, items: tx.items || m.items || [], tip: tx.tip || m.tip };
}

function localizeStatic() {
  document.documentElement.lang = state.lang === 'en' ? 'en' : 'zh-CN';
  document.title = trUI('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = trUI(el.dataset.i18n);
  });
  const langBtn = document.getElementById('lang-toggle');
  if (langBtn) langBtn.textContent = trUI('langToggle');
}

// Helper: which band does a module belong to
function getBand(mid) {
  if (!MODS[mid]) {
    const el = document.getElementById(mid);
    const colEl = el?.closest('[id^="col-"]');
    const colNum = colEl ? parseInt(colEl.id.replace('col-', '')) : NaN;
    if (colNum === 1) return 'top';
    if (colNum === 7) return 'bot';
    return 'mid';
  }
  const col = MODS[mid]?.col;
  if (col === 1) return 'top';
  if (col === 7) return 'bot';
  return 'mid';
}

// Build a horizontal cross-domain band (top or bottom)
function buildBandEl(cd, pos) {
  const band = document.createElement('div');
  band.id = 'band-' + pos;
  band.className = 'band';

  const hdr = document.createElement('div');
  hdr.className = 'band-hdr';
  hdr.textContent = trCol(cd);
  band.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'band-body';
  body.id = cd.id + '-body';

  const colMods = Object.entries(MODS).filter(([,m]) => 'col-' + m.col === cd.id);
  const hasSecs = colMods.some(([,m]) => m.sec);

  if (hasSecs) {
    const secMap = new Map();
    colMods.forEach(([mid, m]) => {
      const key = m.sec || '';
      if (!secMap.has(key)) secMap.set(key, []);
      secMap.get(key).push([mid, m]);
    });
    secMap.forEach((mods, sec) => {
      const secCol = document.createElement('div');
      secCol.className = 'col-sec-col';
      if (sec) secCol.dataset.secGroup = sec;  // for updateVis visibility management
      const cc = SEC_COLOR_MAP[sec] || '';
      if (sec) {
        const subHdr = document.createElement('div');
        subHdr.className = 'col-sub-hdr' + (cc ? ' ' + cc : '');
        subHdr.textContent = trSec(sec);
        secCol.appendChild(subHdr);
      }
      const section = document.createElement('div');
      section.className = 'col-section-v' + (cc ? ' ' + cc : '');
      mods.forEach(([mid, m]) => section.appendChild(buildMod(mid, m)));
      secCol.appendChild(section);
      body.appendChild(secCol);
    });
  } else {
    colMods.forEach(([mid, m]) => body.appendChild(buildMod(mid, m)));
  }

  band.appendChild(body);
  return band;
}

function renderCanvas() {
  _connFwd = null; _connBwd = null;
  const outer = document.getElementById('canvas-outer');
  const svg = document.getElementById('conn-svg');
  outer.innerHTML = '';
  outer.appendChild(svg);

  const topDef      = COL_DEFS.find(cd => cd.band === 'top');
  const toprightDef = COL_DEFS.find(cd => cd.band === 'topright');
  const botDef      = COL_DEFS.find(cd => cd.band === 'bot');
  const midDefs     = COL_DEFS.filter(cd => !cd.band);

  if (toprightDef) {
    const topRow = document.createElement('div');
    topRow.className = 'band-top-row';
    if (topDef) topRow.appendChild(buildBandEl(topDef, 'top'));
    topRow.appendChild(buildBandEl(toprightDef, 'topright'));
    outer.appendChild(topRow);
  } else if (topDef) {
    outer.appendChild(buildBandEl(topDef, 'top'));
  }

  function buildMidColEl(cd) {
    const col = document.createElement('div');
    col.className = 'col';
    col.id = cd.id;
    if (!cd.autoWidth) col.style.width = cd.width + 'px';
    col.style.minWidth = cd.width + 'px';

    const hdr = document.createElement('div');
    hdr.className = 'col-hdr';
    hdr.textContent = trCol(cd);
    col.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'col-body';
    body.id = cd.id + '-body';
    col.appendChild(body);

    const colMods = Object.entries(MODS).filter(([,m]) => 'col-' + m.col === cd.id);
    const hasSecs = colMods.some(([,m]) => m.sec);

    if (hasSecs) {
      const secLayout = cd.secLayout || 'row';
      const secMap = new Map();
      colMods.forEach(([mid, m]) => {
        const key = m.sec || '';
        if (!secMap.has(key)) secMap.set(key, []);
        secMap.get(key).push([mid, m]);
      });

      if (secLayout === 'row' || secLayout === 'stack') {
        if (cd.id === 'col-3') {
          const strip = document.createElement('div');
          strip.className = 'verif-strip';
          const shdr = document.createElement('div');
          shdr.className = 'verif-strip-hdr';
          shdr.textContent = trUI('verificationTitle');
          strip.appendChild(shdr);
          VERIF_PILLS.forEach(p => strip.appendChild(buildVerifPill(p.id, p.label, p.tip[state.lang], p.className || '')));
          body.appendChild(strip);
        }
        const row = document.createElement('div');
        row.className = 'col-sec-row' + (secLayout === 'stack' ? ' col-sec-stack' : '');
        secMap.forEach((mods, sec) => {
          const secCol = document.createElement('div');
          const wide = mods.length > 5;
          secCol.className = 'col-sec-col' + (wide ? ' col-sec-wide' : '');
          if (sec) secCol.id = 'sec-' + sec.replace(/\s+/g, '');
          if (sec) {
            const subHdr = document.createElement('div');
            const cc = SEC_COLOR_MAP[sec] || '';
            subHdr.className = 'col-sub-hdr' + (cc ? ' ' + cc : '');
            subHdr.textContent = trSec(sec);
            secCol.appendChild(subHdr);
          }
          const section = document.createElement('div');
          section.className = 'col-section' + (wide ? ' col-section-2col' : '');
          mods.forEach(([mid, m]) => section.appendChild(buildMod(mid, m)));
          secCol.appendChild(section);
          row.appendChild(secCol);
        });
        body.appendChild(row);
      } else {
        secMap.forEach((mods, sec) => {
          const grp = document.createElement('div');
          grp.className = 'sec-group';
          grp.dataset.secGroup = sec;
          const cc = SEC_COLOR_MAP[sec] || '';
          if (sec) {
            const subHdr = document.createElement('div');
            subHdr.className = 'col-sub-hdr' + (cc ? ' ' + cc : '');
            subHdr.textContent = trSec(sec);
            grp.appendChild(subHdr);
          }
          const section = document.createElement('div');
          section.className = 'col-section-v' + (cc ? ' ' + cc : '');
          mods.forEach(([mid, m]) => section.appendChild(buildMod(mid, m)));
          grp.appendChild(section);
          body.appendChild(grp);
        });
      }
    } else {
      colMods.forEach(([mid, m]) => body.appendChild(buildMod(mid, m)));
    }
    return col;
  }

  // Middle: regular columns, with secGrid cols grouped into 2×2 security controls
  const mid = document.createElement('div');
  mid.id = 'canvas-mid';
  let mi = 0;
  while (mi < midDefs.length) {
    const cd = midDefs[mi];
    if (cd.secGrid) {
      const gridCols = [];
      while (mi < midDefs.length && midDefs[mi].secGrid) { gridCols.push(midDefs[mi++]); }
      const wrap = document.createElement('div');
      wrap.className = 'sec-controls-wrap';
      const wHdr = document.createElement('div');
      wHdr.className = 'sec-controls-hdr';
      wHdr.textContent = trUI('securityControls');
      wrap.appendChild(wHdr);
      const grid = document.createElement('div');
      grid.className = 'sec-controls-grid';
      gridCols.forEach(gcd => grid.appendChild(buildMidColEl(gcd)));
      wrap.appendChild(grid);
      mid.appendChild(wrap);
    } else {
      mid.appendChild(buildMidColEl(cd));
      mi++;
    }
  }
  outer.appendChild(mid);

  if (botDef) outer.appendChild(buildBandEl(botDef, 'bot'));

  updateVis();
}

// ─────────────────────────────────────────────────────────────────────────────
// HOVER HIGHLIGHT — bidirectional BFS through CONNS graph
// ─────────────────────────────────────────────────────────────────────────────
let _connFwd = null, _connBwd = null;
function _buildConnMaps() {
  _connFwd = {}; _connBwd = {};
  CONNS.forEach(([f, t]) => {
    (_connFwd[f] = _connFwd[f] || []).push(t);
    (_connBwd[t] = _connBwd[t] || []).push(f);
  });
}

function getRelated(mid) {
  if (!_connFwd) _buildConnMaps();
  const visited = new Set([mid]);
  const fwd = [mid], bwd = [mid];
  while (fwd.length) { const c = fwd.shift(); (_connFwd[c]||[]).forEach(t=>{ if(!visited.has(t)){visited.add(t);fwd.push(t);} }); }
  while (bwd.length) { const c = bwd.shift(); (_connBwd[c]||[]).forEach(f=>{ if(!visited.has(f)){visited.add(f);bwd.push(f);} }); }
  // Expand sec-* nodes in the result: add their visible child modules (passively highlighted)
  [...visited].forEach(id => {
    if (!id.startsWith('sec-')) return;
    document.getElementById(id)?.querySelectorAll('.mod:not(.hidden)').forEach(m => { if (m.id) visited.add(m.id); });
  });
  return visited;
}

function highlightRelated(mid) {
  const rel = getRelated(mid);
  // Build initial secHlSet: sections directly in rel, or whose visible child is in rel
  const secHlSet = new Set();
  const childSecSet = new Set();
  document.querySelectorAll('[id^="sec-"]').forEach(el => {
    const hasRelatedChild = [...el.querySelectorAll('.mod:not(.hidden)')].some(m => rel.has(m.id));
    if (hasRelatedChild) childSecSet.add(el.id);
    if (rel.has(el.id) || hasRelatedChild)
      secHlSet.add(el.id);
  });
  // Propagate secHlSet bidirectionally through section-to-section connections
  let changed = true;
  while (changed) {
    changed = false;
    secHlSet.forEach(secId => {
      [...(_connFwd[secId]||[]), ...(_connBwd[secId]||[])].forEach(other => {
        if (other.startsWith('sec-') && !secHlSet.has(other)) { secHlSet.add(other); changed = true; }
      });
    });
  }
  // Any highlighted section should carry its visible child modules with it.
  // This lets module hover flow through parent section links, such as
  // m-atp -> sec-安全服务 -> sec-业务资源 -> resource modules.
  secHlSet.forEach(secId => {
    if (childSecSet.has(secId)) return;
    document.getElementById(secId)?.querySelectorAll('.mod:not(.hidden)').forEach(m => {
      if (m.id) rel.add(m.id);
    });
  });
  // Operations and compliance are global controls, so keep enabled bottom-band
  // modules visible in every hover path even when they have no direct line.
  Object.entries(MODS).forEach(([id, m]) => {
    if (m.col === 7 && state.enabled.has(id)) rel.add(id);
  });
  Object.keys(MODS).forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.classList.contains('hidden')) return;
    if (id === mid) { el.classList.add('hovered'); el.classList.remove('dimmed','related'); }
    else if (rel.has(id)) { el.classList.add('related'); el.classList.remove('dimmed','hovered'); }
    else { el.classList.add('dimmed'); el.classList.remove('related','hovered'); }
  });
  document.querySelectorAll('[id^="sec-"]').forEach(el => el.classList.remove('sec-hl'));
  document.querySelectorAll('#conn-svg g.conn-grp').forEach(g => {
    const fHl = rel.has(g.dataset.from) || secHlSet.has(g.dataset.from);
    const tHl = rel.has(g.dataset.to) || secHlSet.has(g.dataset.to);
    g.classList.toggle('conn-bright', fHl && tHl);
    g.classList.toggle('conn-dim', !(fHl && tHl));
  });
}

function clearHighlight() {
  document.querySelectorAll('.mod,.vid').forEach(el => el.classList.remove('dimmed','related','hovered'));
  document.querySelectorAll('[id^="sec-"]').forEach(el => el.classList.remove('sec-hl'));
  document.querySelectorAll('#conn-svg g.conn-grp').forEach(g => {
    g.classList.remove('conn-bright','conn-dim');
    const p = g.querySelector('path');
    if (p && g.dataset.sw) p.setAttribute('stroke-width', g.dataset.sw);
  });
}

function applyPinnedHighlight() {
  if (!state.pinnedHighlight) return;
  const el = document.getElementById(state.pinnedHighlight);
  if (!el || el.classList.contains('hidden')) {
    state.pinnedHighlight = null;
    clearHighlight();
    return;
  }
  highlightRelated(state.pinnedHighlight);
}

function togglePinnedHighlight(id) {
  state.pinnedHighlight = state.pinnedHighlight === id ? null : id;
  clearHighlight();
  applyPinnedHighlight();
}

function buildVerifPill(id, label, tip, extraClass = '', relatedModule = false) {
  const el = document.createElement('div');
  el.className = 'vid' + (extraClass ? ' ' + extraClass : '');
  el.id = id;
  el.textContent = label;
  el.addEventListener('mouseenter', e => {
    showTip(e, tip);
    if (state.pinnedHighlight) return;
    if (relatedModule) highlightRelated(id);
    else el.classList.add('hovered');
  });
  el.addEventListener('mousemove', e => moveTip(e));
  el.addEventListener('mouseleave', () => {
    hideTip();
    if (state.pinnedHighlight) return;
    if (relatedModule) clearHighlight();
    else el.classList.remove('hovered');
  });
  if (relatedModule) {
    el.addEventListener('click', e => {
      e.stopPropagation();
      togglePinnedHighlight(id);
    });
  }
  return el;
}

function buildMod(mid, m) {
  const el = document.createElement('div');
  el.className = 'mod ' + m.theme;
  el.id = mid;
  const tm = trMod(mid, m);

  let ch = '';
  if (m.ch) ch = `<span class="ctag ctag-${m.ch}">${m.ch}</span>`;

  el.innerHTML = `
    <div class="mod-lbl">${ch}<span>${tm.label}</span></div>
    <div class="mod-items">${(tm.items||[]).map(i=>`<div class="mod-item">${i}</div>`).join('')}</div>
  `;
  el.addEventListener('mouseenter', e => {
    showTip(e, trMod(mid, m).tip);
    if (!state.pinnedHighlight) highlightRelated(mid);
  });
  el.addEventListener('mousemove',  e => moveTip(e));
  el.addEventListener('mouseleave', () => {
    hideTip();
    if (!state.pinnedHighlight) clearHighlight();
  });
  el.addEventListener('click', e => {
    e.stopPropagation();
    togglePinnedHighlight(mid);
  });
  return el;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER SIDEBAR
// ─────────────────────────────────────────────────────────────────────────────
function renderSidebar() {
  const body = document.getElementById('sb-body');
  body.innerHTML = '';
  GROUPS.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'sg';

    const hdr = document.createElement('div');
    hdr.className = 'sg-hdr';
    const dot = document.createElement('span');
    dot.className = 'sg-dot'; dot.style.background = g.color;
    const gcb = document.createElement('input');
    gcb.type = 'checkbox'; gcb.id = 'gcb-' + g.id; gcb.className = 'gcb';
    const validMods = g.mods.filter(m => MODS[m]);
    const enCnt = validMods.filter(m => state.enabled.has(m)).length;
    gcb.checked = enCnt === validMods.length && validMods.length > 0;
    gcb.indeterminate = enCnt > 0 && enCnt < validMods.length;
    gcb.addEventListener('click', e => {
      e.stopPropagation();
      const on = gcb.checked;
      validMods.forEach(mid => toggle(mid, on));
    });
    const lbl = document.createElement('span');
    lbl.className = 'sg-lbl'; lbl.textContent = trGroup(g);
    const cnt = document.createElement('span');
    cnt.className = 'sg-cnt'; cnt.textContent = g.mods.length;
    const arrow = document.createElement('span');
    arrow.className = 'sg-arrow'; arrow.textContent = '›';
    hdr.append(dot, gcb, lbl, cnt, arrow);

    const items = document.createElement('div');
    items.className = 'sg-items open';

    hdr.addEventListener('click', () => {
      items.classList.toggle('open');
      arrow.classList.toggle('open', items.classList.contains('open'));
    });
    arrow.classList.add('open');

    g.mods.forEach(mid => {
      const m = MODS[mid];
      if (!m) return;
      const row = document.createElement('div');
      row.className = 'cb-row' + (state.enabled.has(mid) ? ' checked' : '');
      row.id = 'cbr-' + mid;
      row.innerHTML = `<input type="checkbox" id="cb-${mid}" ${state.enabled.has(mid)?'checked':''}><span class="cb-lbl">${trMod(mid, m).label}</span>`;
      row.querySelector('input').addEventListener('change', e => toggle(mid, e.target.checked));
      items.appendChild(row);
    });

    wrap.appendChild(hdr);
    wrap.appendChild(items);
    body.appendChild(wrap);
  });
}

function renderPresets() {
  const bar = document.getElementById('presets');
  bar.innerHTML = '';
  PRESETS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'btn-preset' + (state.activePreset === p.id ? ' active' : '');
    btn.textContent = trPreset(p);
    btn.id = 'pb-' + p.id;
    btn.addEventListener('click', () => applyPreset(p));
    bar.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// STATE MUTATIONS
// ─────────────────────────────────────────────────────────────────────────────
function toggle(mid, on) {
  if (on) state.enabled.add(mid); else state.enabled.delete(mid);
  state.activePreset = null;
  syncCheckbox(mid, on);
  const pg = GROUPS.find(g => g.mods.includes(mid));
  if (pg) syncGroupCheckbox(pg.id);
  updateVis();
  schedDraw();
  updateStats();
  updatePresetBtns();
}

function syncCheckbox(mid, on) {
  const cb = document.getElementById('cb-' + mid);
  const row = document.getElementById('cbr-' + mid);
  if (cb) cb.checked = on;
  if (row) row.classList.toggle('checked', on);
}

function syncGroupCheckbox(gid) {
  const g = GROUPS.find(g => g.id === gid);
  const gcb = document.getElementById('gcb-' + gid);
  if (!g || !gcb) return;
  const valid = g.mods.filter(m => MODS[m]);
  const en = valid.filter(m => state.enabled.has(m)).length;
  gcb.checked = en === valid.length && valid.length > 0;
  gcb.indeterminate = en > 0 && en < valid.length;
}

function applyPreset(p) {
  state.enabled.clear();
  p.mods.forEach(id => state.enabled.add(id));
  state.activePreset = p.id;
  Object.keys(MODS).forEach(mid => syncCheckbox(mid, state.enabled.has(mid)));
  GROUPS.forEach(g => syncGroupCheckbox(g.id));
  updateVis();
  schedDraw();
  updateStats();
  updatePresetBtns();
}

function updatePresetBtns() {
  PRESETS.forEach(p => {
    const btn = document.getElementById('pb-' + p.id);
    if (btn) btn.classList.toggle('active', state.activePreset === p.id);
  });
}

function selectAll() {
  Object.keys(MODS).forEach(id => { state.enabled.add(id); syncCheckbox(id, true); });
  state.activePreset = null;
  updateVis(); schedDraw(); updateStats(); updatePresetBtns();
}

function resetAll() {
  state.enabled.clear();
  Object.keys(MODS).forEach(id => syncCheckbox(id, false));
  state.activePreset = null;
  updateVis(); drawConns(); updateStats(); updatePresetBtns();
}

function updateVis() {
  Object.keys(MODS).forEach(mid => {
    const el = document.getElementById(mid);
    if (el) el.classList.toggle('hidden', !state.enabled.has(mid));
  });
  // Hide vertical sec-groups (header + box) when all their modules are disabled
  document.querySelectorAll('[data-sec-group]').forEach(grp => {
    const s = grp.dataset.secGroup;
    if (!s) return;
    const hasEnabled = Object.entries(MODS).some(([mid, m]) => m.sec === s && state.enabled.has(mid));
    grp.classList.toggle('hidden', !hasEnabled);
  });
  // Hide horizontal sec-col divs when all their modules are disabled (frees width)
  document.querySelectorAll('[id^="sec-"]').forEach(secCol => {
    const hasVis = secCol.querySelectorAll('.mod:not(.hidden)').length > 0;
    secCol.style.display = hasVis ? '' : 'none';
  });
  // Adjust 2-col grid to 1 col when ≤1 module visible (avoids wasted width)
  document.querySelectorAll('.col-section-2col').forEach(section => {
    const vis = section.querySelectorAll('.mod:not(.hidden)').length;
    section.style.gridTemplateColumns = vis <= 1 ? 'minmax(140px,auto)' : 'repeat(2,minmax(140px,auto))';
  });
  // col-6: auto 2-row grid when >2 sections visible
  const c6row = document.querySelector('#col-6-body .col-sec-row');
  if (c6row) {
    const visSecs = [...c6row.children].filter(s => s.style.display !== 'none');
    const n = visSecs.length;
    if (n > 2) {
      c6row.style.display = 'grid';
      c6row.style.gridTemplateColumns = `repeat(${Math.ceil((n + 1) / 2)}, 1fr)`;
      c6row.style.alignItems = 'start';
    } else {
      c6row.style.display = '';
      c6row.style.gridTemplateColumns = '';
      c6row.style.alignItems = '';
    }
  }
  applyPinnedHighlight();
}

// ─────────────────────────────────────────────────────────────────────────────
// DRAW CONNECTIONS
// ─────────────────────────────────────────────────────────────────────────────
let drawTimer = null;
function schedDraw() {
  if (drawTimer) cancelAnimationFrame(drawTimer);
  drawTimer = requestAnimationFrame(() => { requestAnimationFrame(drawConns); });
}

function drawConns() {
  const svg = document.getElementById('conn-svg');
  const outer = document.getElementById('canvas-outer');
  svg.innerHTML = '';

  const cW = outer.scrollWidth, cH = outer.scrollHeight;
  svg.setAttribute('width', cW);
  svg.setAttribute('height', cH);

  const cRect = outer.getBoundingClientRect();
  let active = 0;

  CONNS.forEach(([fid, tid, color, style]) => {
    const isMod = id => id.startsWith('m-');
    if (isMod(fid) && !state.enabled.has(fid)) return;
    if (isMod(tid) && !state.enabled.has(tid)) return;
    const fe = document.getElementById(fid);
    const te = document.getElementById(tid);
    if (!fe || !te) return;
    if (!isMod(fid) && !fe.offsetParent) return;
    if (!isMod(tid) && !te.offsetParent) return;

    const fr = fe.getBoundingClientRect();
    const tr = te.getBoundingClientRect();

    const fBand = getBand(fid);
    const tBand = getBand(tid);
    const crossBand = fBand !== tBand;

    let x1, y1, x2, y2, c2x, c2y, d;

    if (crossBand) {
      // Vertical bezier: source exits bottom/top, target receives at top/bottom
      const goDown = (fBand === 'top') || (fBand === 'mid' && tBand === 'bot');
      if (goDown) {
        x1 = fr.left + fr.width/2 - cRect.left;  y1 = fr.bottom - cRect.top;
        x2 = tr.left + tr.width/2 - cRect.left;  y2 = tr.top    - cRect.top;
      } else {
        // going up: mid → top or bot → mid
        x1 = fr.left + fr.width/2 - cRect.left;  y1 = fr.top    - cRect.top;
        x2 = tr.left + tr.width/2 - cRect.left;  y2 = tr.bottom - cRect.top;
      }
      const dy = Math.max(20, Math.abs(y2-y1)*0.45);
      const sign = y2 > y1 ? 1 : -1;
      c2x = x2;
      c2y = y2-sign*dy;
      d = `M${x1},${y1} C${x1},${y1+sign*dy} ${x2},${y2-sign*dy} ${x2},${y2}`;
    } else {
      // Horizontal bezier (same band or mid-to-mid)
      const goRight = tr.left >= fr.left;
      x1 = (goRight ? fr.right : fr.left) - cRect.left;
      y1 = fr.top + fr.height/2 - cRect.top;
      x2 = (goRight ? tr.left : tr.right) - cRect.left;
      y2 = tr.top + tr.height/2 - cRect.top;
      const dx = Math.max(20, Math.abs(x2-x1)*0.45);
      const sign = goRight ? 1 : -1;
      c2x = x2-sign*dx;
      c2y = y2;
      d = `M${x1},${y1} C${x1+sign*dx},${y1} ${c2x},${c2y} ${x2},${y2}`;
    }

    const sw = '1.4';
    // Cross-band connections are very faint in static view — hover highlight reveals them
    const op = crossBand ? 0.12 : (style === 'dot' ? 0.45 : 0.65);

    const grp = document.createElementNS('http://www.w3.org/2000/svg','g');
    grp.classList.add('conn-grp');
    grp.dataset.from = fid;
    grp.dataset.to = tid;
    grp.dataset.sw = sw;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', sw);
    path.setAttribute('opacity', op);
    if (style === 'dash') path.setAttribute('stroke-dasharray','7,3');
    if (style === 'dot')  path.setAttribute('stroke-dasharray','2,5');
    grp.appendChild(path);

    // Arrowhead follows the bezier tangent at the end of the path.
    const ang = Math.atan2(y2 - c2y, x2 - c2x);
    const s = 5;
    const pts = [
      [x2, y2],
      [x2 - s*Math.cos(ang-0.42), y2 - s*Math.sin(ang-0.42)],
      [x2 - s*Math.cos(ang+0.42), y2 - s*Math.sin(ang+0.42)],
    ].map(p=>p.join(',')).join(' ');
    const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arrow.setAttribute('points', pts);
    arrow.setAttribute('fill', color);
    arrow.setAttribute('opacity', op);
    grp.appendChild(arrow);
    svg.appendChild(grp);

    active++;
  });

  document.getElementById('s-conns').textContent = active;
  applyPinnedHighlight();
}

// ─────────────────────────────────────────────────────────────────────────────
// EXPORT PNG
// ─────────────────────────────────────────────────────────────────────────────
function waitFrame() {
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function exportBounds(mode) {
  const outer = document.getElementById('canvas-outer');
  const cRect = outer.getBoundingClientRect();
  const targets = mode === 'highlight'
    ? [...outer.querySelectorAll('.mod.hovered,.mod.related,.vid.hovered,.vid.related')]
    : [...outer.querySelectorAll('.mod:not(.hidden),.vid:not(.hidden)')];
  const addTarget = el => {
    if (el && !targets.includes(el)) targets.push(el);
  };

  [...targets].forEach(el => {
    const col = el.closest('.col');
    const band = el.closest('.band');
    const secCol = el.closest('.col-sec-col');
    const secGroup = el.closest('.sec-group');
    const secWrap = el.closest('.sec-controls-wrap');
    const colHdr = col?.querySelector(':scope > .col-hdr');
    const bandHdr = [...(band?.children || [])].find(child => child.classList?.contains('band-hdr'));
    const secHdr = secCol?.querySelector(':scope > .col-sub-hdr') || secGroup?.querySelector(':scope > .col-sub-hdr');
    const wrapHdr = secWrap?.querySelector(':scope > .sec-controls-hdr');
    [colHdr, bandHdr, secHdr, wrapHdr].forEach(addTarget);
  });

  const connSelector = mode === 'highlight'
    ? '#conn-svg g.conn-bright path,#conn-svg g.conn-bright polygon'
    : '#conn-svg g.conn-grp path,#conn-svg g.conn-grp polygon';
  targets.push(...outer.querySelectorAll(connSelector));

  const visibleTargets = targets.filter(el => {
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });

  if (!visibleTargets.length) return null;
  const pad = 18;
  const box = visibleTargets.reduce((acc, el) => {
    const r = el.getBoundingClientRect();
    acc.left = Math.min(acc.left, r.left - cRect.left);
    acc.top = Math.min(acc.top, r.top - cRect.top);
    acc.right = Math.max(acc.right, r.right - cRect.left);
    acc.bottom = Math.max(acc.bottom, r.bottom - cRect.top);
    return acc;
  }, { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity });

  const x = Math.max(0, Math.floor(box.left - pad));
  const y = Math.max(0, Math.floor(box.top - pad));
  const right = Math.min(outer.scrollWidth, Math.ceil(box.right + pad));
  const bottom = Math.min(outer.scrollHeight, Math.ceil(box.bottom + pad));
  return { x, y, w: Math.max(1, right - x), h: Math.max(1, bottom - y) };
}

async function downloadCanvasPng(filename, mode = 'selected') {
  hideTip();
  await waitFrame();
  drawConns();
  await waitFrame();

  const outer = document.getElementById('canvas-outer');
  const bounds = exportBounds(mode);
  if (!bounds) {
    alert(mode === 'highlight'
      ? (state.lang === 'en' ? 'Pin or hover a module first, then export the highlighted area.' : '请先点击固定或悬浮一个模块，再导出高亮部分。')
      : (state.lang === 'en' ? 'No visible modules to export.' : '当前没有可导出的模块。'));
    return;
  }

  const clone = outer.cloneNode(true);
  clone.querySelector('#conn-svg')?.setAttribute('width', outer.scrollWidth);
  clone.querySelector('#conn-svg')?.setAttribute('height', outer.scrollHeight);
  clone.style.position = 'relative';
  clone.style.width = outer.scrollWidth + 'px';
  clone.style.height = outer.scrollHeight + 'px';
  clone.style.minWidth = '0';
  clone.style.background = 'transparent';
  clone.style.transform = `translate(${-bounds.x}px,${-bounds.y}px)`;
  clone.style.transformOrigin = '0 0';

  const styles = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const wrapper = document.createElement('div');
  wrapper.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  wrapper.className = 'export-root';
  wrapper.style.width = bounds.w + 'px';
  wrapper.style.height = bounds.h + 'px';
  wrapper.style.overflow = 'hidden';
  wrapper.style.background = 'transparent';
  wrapper.innerHTML = `<style>${styles}
.export-root,.export-root *{font-family:SimHei,"Heiti SC",Arial,sans-serif !important;}</style>`;
  wrapper.appendChild(clone);

  const serialized = new XMLSerializer().serializeToString(wrapper);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${bounds.w}" height="${bounds.h}"><foreignObject width="100%" height="100%">${serialized}</foreignObject></svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const scale = Math.max(2, window.devicePixelRatio || 1);
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(bounds.w * scale);
    canvas.height = Math.ceil(bounds.h * scale);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, bounds.w, bounds.h);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(png => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(png);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    alert(state.lang === 'en' ? 'PNG export failed in this browser.' : '当前浏览器导出 PNG 失败。');
  };
  img.src = url;
}

async function exportPng(mode) {
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  if (mode === 'all') {
    const prevEnabled = new Set(state.enabled);
    const prevPreset = state.activePreset;
    const prevPin = state.pinnedHighlight;
    Object.keys(MODS).forEach(id => state.enabled.add(id));
    state.activePreset = null;
    Object.keys(MODS).forEach(id => syncCheckbox(id, true));
    GROUPS.forEach(g => syncGroupCheckbox(g.id));
    state.pinnedHighlight = null;
    clearHighlight();
    updateVis();
    await waitFrame();
    await downloadCanvasPng(`zero-trust-all-${stamp}.png`, 'selected');
    state.enabled = prevEnabled;
    state.activePreset = prevPreset;
    state.pinnedHighlight = prevPin;
    Object.keys(MODS).forEach(id => syncCheckbox(id, state.enabled.has(id)));
    GROUPS.forEach(g => syncGroupCheckbox(g.id));
    updateVis();
    schedDraw();
    updateStats();
    updatePresetBtns();
    return;
  }

  if (mode === 'highlight' && state.pinnedHighlight) {
    clearHighlight();
    highlightRelated(state.pinnedHighlight);
  }
  if (mode === 'selected') {
    const prevPin = state.pinnedHighlight;
    state.pinnedHighlight = null;
    clearHighlight();
    await downloadCanvasPng(`zero-trust-${mode}-${stamp}.png`, mode);
    state.pinnedHighlight = prevPin;
    applyPinnedHighlight();
    return;
  }
  await downloadCanvasPng(`zero-trust-${mode}-${stamp}.png`, mode);
}

// ─────────────────────────────────────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────────────────────────────────────
function showTip(e, text) {
  if (!text) return;
  const t = document.getElementById('tip');
  t.textContent = text;
  t.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  const t = document.getElementById('tip');
  let x = e.clientX + 14, y = e.clientY - 8;
  if (x + 250 > window.innerWidth) x = e.clientX - 254;
  if (y + 60 > window.innerHeight) y = e.clientY - 70;
  t.style.left = x + 'px';
  t.style.top  = y + 'px';
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  localizeStatic();
  renderCanvas();
  renderPresets();
  renderSidebar();

  // Apply medium enterprise default
  applyPreset(PRESETS[2]);

  document.getElementById('sase-detail-toggle').addEventListener('click', e => {
    setSaseDetail(e.currentTarget.getAttribute('aria-pressed') !== 'true');
  });
  document.getElementById('lang-toggle').addEventListener('click', () => {
    setLanguage(state.lang === 'zh' ? 'en' : 'zh');
  });
  document.getElementById('export-selected').addEventListener('click', () => exportPng('selected'));
  document.getElementById('export-highlight').addEventListener('click', () => exportPng('highlight'));
  document.getElementById('export-all').addEventListener('click', () => exportPng('all'));

  // Redraw on scroll/resize
  document.getElementById('cv-wrap').addEventListener('scroll', schedDraw);
  window.addEventListener('resize', schedDraw);
});
</script>
</body>
</html>
