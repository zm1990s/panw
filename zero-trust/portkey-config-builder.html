<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portkey Config Builder</title>
<style>
:root{
  --bg:#0d1117;--s1:#161b27;--s2:#1e2536;--s3:#252d40;
  --bd:#2a3354;--ac:#3b82f6;--acd:rgba(59,130,246,.15);--req:#f87171;--req-bd:#f87171;
  --tx:#e2e8f0;--mu:#7e90b3;
  --ok:#10b981;--wa:#f59e0b;--er:#ef4444;--pu:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;font-size:13px;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
header{background:var(--s1);border-bottom:1px solid var(--bd);padding:9px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
header h1{font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.badge{background:var(--ac);color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.bg{background:var(--s3);color:var(--mu);border:1px solid var(--bd)}
.spacer{flex:1}
.lang-sw{display:flex;gap:2px;background:var(--s3);border-radius:6px;padding:2px}
.lb{background:none;border:none;color:var(--mu);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
.lb.on{background:var(--ac);color:#fff}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}
.fp{flex:1;overflow-y:auto;padding:12px 14px;border-right:1px solid var(--bd);min-width:0}
.op{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--bd);background:var(--s1);flex-shrink:0}
.tab{padding:9px 18px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mu);font-size:12px;font-weight:600;transition:all .15s;user-select:none;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.tc{flex:1;overflow:auto;display:none}
.tc.on{display:flex;flex-direction:column}
.jv{padding:14px;display:flex;flex-direction:column;gap:10px;height:100%}
.jtb{display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.jtb .lbl{font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
pre#jo{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px;font-family:'Fira Code','Cascadia Code',monospace;font-size:12px;line-height:1.7;overflow:auto;flex:1}
.dv{padding:20px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}

/* BUTTONS */
.btn{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;line-height:1.4;white-space:nowrap}
.bp{background:var(--ac);color:#fff}.bp:hover{background:#2563eb}
.bg2{background:transparent;color:var(--mu);border:1px solid var(--bd)}.bg2:hover{color:var(--tx);border-color:var(--mu)}
.br{background:transparent;color:var(--er);border:1px solid rgba(239,68,68,.4)}.br:hover{background:rgba(239,68,68,.1)}
.sm{padding:3px 8px;font-size:11px}
.ic{background:none;border:none;cursor:pointer;color:var(--mu);padding:2px 4px;font-size:14px;transition:color .15s}.ic:hover{color:var(--er)}

/* CARDS */
.card{margin-bottom:14px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
#c-base{border-left:3px solid #3b82f6}
#c-strat{border-left:3px solid #a855f7}
#c-tgt{border-left:3px solid #10b981}
.chd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1a2035;user-select:none;cursor:pointer;position:sticky;top:0;z-index:10}
.chd:hover{background:#202840}
#c-base .chd{border-bottom:1px solid rgba(59,130,246,.25)}
#c-strat .chd{border-bottom:1px solid rgba(168,85,247,.25)}
#c-tgt .chd{border-bottom:1px solid rgba(16,185,129,.25)}
.ct{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:.01em}
.ci{font-size:17px}
#c-base .ct{color:#93c5fd}
#c-strat .ct{color:#d8b4fe}
#c-tgt .ct{color:#6ee7b7}
.cbd{padding:14px}

/* SUBSECTIONS */
.sub{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:10px}
.sub:last-child{margin-bottom:0}
.shd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--s2);cursor:pointer;user-select:none}
.shd:hover{background:var(--s3)}
.sht{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--tx)}
.shi{font-size:14px}
.sbd{padding:12px}
.sub.cl .sbd{display:none}
.chev{color:var(--mu);font-size:10px;transition:transform .2s;margin-left:2px}
.sub:not(.cl) .chev{transform:rotate(180deg)}

/* TOGGLE */
.tog{position:relative;width:34px;height:18px;background:#4b5568;border-radius:9px;cursor:pointer;transition:background .2s;flex-shrink:0;border:1px solid #64748b}
.tog.on{background:var(--ac);border-color:var(--ac)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:#e2e8f0;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tog.on::after{transform:translateX(15px);background:#fff}

/* FORM */
.fi{margin-bottom:10px}.fi:last-child{margin-bottom:0}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px;font-weight:600;letter-spacing:.3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:6px 9px;border-radius:6px;font-size:12.5px;outline:none;transition:border-color .15s;font-family:inherit}
input:focus,select:focus{border-color:var(--ac)}
select option{background:var(--s2)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:10.5px;color:var(--mu);margin-top:3px}
.req{color:var(--req);margin-left:2px;font-weight:700}
.sep{border:none;border-top:1px solid var(--bd);margin:10px 0}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.tag{background:var(--acd);border:1px solid rgba(59,130,246,.3);color:var(--ac);padding:2px 7px;border-radius:4px;font-size:11px;display:flex;align-items:center;gap:3px}
.tag button{background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:11px;line-height:1;opacity:.7}.tag button:hover{opacity:1}
.trow{display:flex;gap:5px}.trow input{flex:1}

/* TARGET CARD */
.tcard{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:11px;margin-bottom:8px}
.thd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.tnum{font-size:10px;font-weight:700;color:var(--ac);background:var(--acd);padding:2px 8px;border-radius:3px;letter-spacing:.5px}
.tbdy{display:flex;flex-direction:column;gap:8px}

/* KV (drop_params etc.) */
.kvl{display:flex;flex-direction:column;gap:5px;margin-bottom:5px}
.kvr{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;align-items:center}
.kvr input{font-size:11.5px;padding:4px 7px}

/* PARAM PICKER */
.ppanel{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:6px}
.pgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pgroup-hd{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;padding-bottom:4px;margin-bottom:4px;border-bottom:1px solid var(--bd)}
.ptag{padding:3px 6px;border-radius:4px;cursor:pointer;font-size:11px;font-family:monospace;transition:all .15s;user-select:none;display:flex;align-items:center;gap:4px;color:var(--mu)}
.ptag:hover{background:var(--s3);color:var(--tx)}
.ptag.on{background:var(--acd);color:var(--ac);font-weight:600}

/* PARAM CONTROLS */
.pctl{border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-bottom:6px;background:var(--bg)}
.pctl-hd{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.pctl-k{font-size:11px;font-weight:700;color:var(--ac);font-family:monospace;flex:1}
.pctl-grp{font-size:10px;color:var(--mu)}
.pctl-rm{background:none;border:none;cursor:pointer;color:var(--mu);font-size:14px;padding:0 2px;line-height:1;transition:color .15s}.pctl-rm:hover{color:var(--er)}
.srow{display:flex;gap:8px;align-items:center}.srow input[type=range]{flex:1;accent-color:var(--ac)}
.sval{font-size:11.5px;color:var(--ac);font-family:monospace;min-width:42px;text-align:right;background:var(--s2);padding:2px 5px;border-radius:3px}
.subrows{display:flex;flex-direction:column;gap:5px;background:var(--s2);border-radius:5px;padding:7px;margin-top:2px}
.subrow{display:grid;grid-template-columns:110px 1fr;gap:6px;align-items:center}
.subrow>label{font-size:10.5px;color:var(--mu)}
.pkv-rows{display:flex;flex-direction:column;gap:4px}
.pkv-r{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;align-items:center}
.pkv-r input{font-size:11.5px;padding:4px 7px}
.padd-btn{width:100%;margin-top:6px}

/* CONDITIONS */
.cond-block{background:rgba(0,0,0,.18);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-bottom:8px}
.cond-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cond-num{font-size:12px;font-weight:700;color:var(--t1);white-space:nowrap;margin-right:6px}
.logic-sel{font-size:11px;padding:3px 6px;width:auto;flex-shrink:0}
.cond-simple{display:grid;grid-template-columns:1fr 88px 1fr 1fr;gap:5px;align-items:center}
.cond-sub{display:grid;grid-template-columns:1fr 88px 1fr auto;gap:5px;align-items:center;margin-bottom:4px}
.cond-block input,.cond-block select{font-size:11.5px;padding:4px 7px}

/* JSON colors */
.jk{color:#7dd3fc}.js{color:#86efac}.jn{color:#fb923c}.jb{color:#c084fc}.jnull{color:#f87171}

/* DIAGRAM */
#dsvg{max-width:100%}
</style>
</head>
<body>

<header>
  <span style="font-size:18px">🔧</span>
  <h1 data-i="title">AI Gateway Portkey Config Builder</h1>
  <span class="badge">Prisma AIRS AI Gateway</span>
  <div class="spacer"></div>
  <div class="lang-sw">
    <button class="lb on" onclick="setLang('en')">EN</button>
    <button class="lb" onclick="setLang('zh')">中文</button>
    <button class="lb" onclick="setLang('ja')">日本語</button>
    <button class="lb" onclick="setLang('ko')">한국어</button>
  </div>
  <button class="btn bg2 sm" onclick="resetAll()" data-i="reset">↺ Reset</button>
  <button class="btn bg2 sm" onclick="trigImport()" data-i="imp">⬆ Import</button>
  <button class="btn bg2 sm" onclick="exportFile()" data-i="exp">⬇ Export</button>
  <input type="file" id="imp-file" accept=".json,application/json" style="display:none" onchange="handleImport(event)">
</header>

<div class="main">
<!-- ══════════ FORM PANEL ══════════ -->
<div class="fp">

<!-- ① BASE CONFIG -->
<div class="card" id="c-base">
  <div class="chd" onclick="toggleCard('c-base')">
    <div class="ct"><span class="ci">🔧</span><span data-i="c_base">基础配置</span></div>
    <span class="chev">▼</span>
  </div>
  <div class="cbd">

    <!-- Retry -->
    <div class="sub" id="s-retry">
      <div class="shd" onclick="toggleSub('s-retry')">
        <div class="sht"><span class="shi">🔁</span><span data-i="s_retry">Retry 重试</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="tog" id="tog-retry" onclick="event.stopPropagation();togFeat('retry')"></div>
          <span class="chev">▼</span>
        </div>
      </div>
      <div class="sbd">
        <div class="r2">
          <div class="fi"><label data-i="attempts">重试次数</label>
            <input type="number" id="retry-attempts" value="3" min="1" max="10" oninput="upd()"></div>
          <div class="fi"><label data-i="retry_after">Retry-After 头</label>
            <select id="retry-after" onchange="upd()"><option value="false">false</option><option value="true">true</option></select></div>
        </div>
        <div class="fi"><label data-i="retry_codes">触发状态码 <span class="hint" style="display:inline" data-i="empty_nonx">（空=任意非2xx）</span></label>
          <div class="tags" id="rc-tags"></div>
          <div class="trow"><input id="rc-in" type="number" placeholder="429" onkeydown="tagEnter(event,'rc')">
          <button class="btn bg2 sm" onclick="addTag('rc')">+</button></div></div>
      </div>
    </div>

    <!-- Cache -->
    <div class="sub" id="s-cache">
      <div class="shd" onclick="toggleSub('s-cache')">
        <div class="sht"><span class="shi">💾</span><span data-i="s_cache">Cache 缓存</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="tog" id="tog-cache" onclick="event.stopPropagation();togFeat('cache')"></div>
          <span class="chev">▼</span>
        </div>
      </div>
      <div class="sbd">
        <div class="r2">
          <div class="fi"><label data-i="cache_mode">模式</label>
            <select id="cache-mode" onchange="upd()">
              <option value="simple" data-i-opt="cache_simple">simple — 精确匹配</option>
              <option value="semantic" data-i-opt="cache_semantic">semantic — 语义匹配</option>
            </select></div>
          <div class="fi"><label data-i="cache_age">Max Age（秒）</label>
            <input type="number" id="cache-age" placeholder="3600" oninput="upd()"></div>
        </div>
      </div>
    </div>

    <!-- Circuit Breaker -->
    <div class="sub" id="s-cb">
      <div class="shd" onclick="toggleSub('s-cb')">
        <div class="sht"><span class="shi">⚡</span><span data-i="s_cb">Circuit Breaker 熔断</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="tog" id="tog-cb" onclick="event.stopPropagation();togFeat('cb')"></div>
          <span class="chev">▼</span>
        </div>
      </div>
      <div class="sbd">
        <div class="r2">
          <div class="fi"><label data-i="cb_thresh">失败阈值（次）</label>
            <input type="number" id="cb-thresh" value="3" min="1" oninput="upd()"></div>
          <div class="fi"><label data-i="cb_thresh_pct">阈值百分比（%）</label>
            <input type="number" id="cb-pct" placeholder="20" min="1" max="100" oninput="upd()">
            <div class="hint" data-i="cb_pct_h">设置后覆盖次数阈值</div></div>
        </div>
        <div class="r2">
          <div class="fi"><label data-i="cb_cooldown">冷却时间（ms）</label>
            <input type="number" id="cb-cool" value="60000" min="30000" step="1000" oninput="upd()"></div>
          <div class="fi"><label data-i="cb_minreq">最小请求数</label>
            <input type="number" id="cb-minreq" placeholder="10" oninput="upd()"></div>
        </div>
        <div class="fi"><label data-i="cb_codes">失败状态码 <span class="hint" style="display:inline" data-i="cb_codes_h">（空=&gt;500所有）</span></label>
          <div class="tags" id="cbc-tags"></div>
          <div class="trow"><input id="cbc-in" type="number" placeholder="500" onkeydown="tagEnter(event,'cbc')">
          <button class="btn bg2 sm" onclick="addTag('cbc')">+</button></div></div>
      </div>
    </div>

    <!-- Guardrails -->
    <div class="sub cl" id="s-gr">
      <div class="shd" onclick="toggleSub('s-gr')">
        <div class="sht"><span class="shi">🛡️</span><span data-i="s_gr">Guardrails 护栏</span></div>
        <span class="chev">▼</span>
      </div>
      <div class="sbd">
        <div class="fi"><label data-i="input_gr">Input Guardrails</label>
          <div id="igr-list"></div>
          <button class="btn bg2 sm" style="margin-top:4px;width:100%" onclick="addGR('input')" data-i="add_igr">+ 添加</button></div>
        <hr class="sep">
        <div class="fi"><label data-i="output_gr">Output Guardrails</label>
          <div id="ogr-list"></div>
          <button class="btn bg2 sm" style="margin-top:4px;width:100%" onclick="addGR('output')" data-i="add_ogr">+ 添加</button></div>
      </div>
    </div>

    <!-- Global -->
    <div class="r2" style="margin-top:10px">
      <div class="fi"><label data-i="g_timeout">全局超时（ms）</label>
        <input type="number" id="g-timeout" placeholder="10000" oninput="upd()"></div>
      <div class="fi"><label data-i="fwd_h">透传请求头</label>
        <div class="trow"><input id="fh-in" type="text" placeholder="x-request-id" onkeydown="tagEnter(event,'fh')">
        <button class="btn bg2 sm" onclick="addTag('fh')">+</button></div>
        <div class="tags" id="fh-tags" style="margin-top:4px"></div></div>
    </div>

  </div>
</div>

<!-- ② STRATEGY -->
<div class="card" id="c-strat">
  <div class="chd" onclick="toggleCard('c-strat')">
    <div class="ct"><span class="ci">🔀</span><span data-i="c_strat">策略 Strategy</span></div>
    <span class="chev">▼</span>
  </div>
  <div class="cbd">

    <div class="fi">
      <label data-i="strat_mode">路由模式</label>
      <select id="strat-mode" onchange="onModeChange()">
        <option value="none" selected data-i-opt="m_none">none — 不指定目标</option>
        <option value="single" data-i-opt="m_single">single — 单目标</option>
        <option value="fallback" data-i-opt="m_fallback">fallback — 失败时自动切换</option>
        <option value="loadbalance" data-i-opt="m_lb">loadbalance — 按权重分发</option>
        <option value="conditional" data-i-opt="m_cond">conditional — 按条件路由</option>
      </select>
    </div>

    <!-- Fallback: on_status_codes -->
    <div id="strat-fallback-opts" style="display:none">
      <div class="fi"><label data-i="fb_codes">Fallback 触发状态码 <span class="hint" style="display:inline" data-i="empty_nonx">（空=任意非2xx）</span></label>
        <div class="tags" id="fb-tags"></div>
        <div class="trow"><input id="fb-in" type="number" placeholder="429" onkeydown="tagEnter(event,'fb')">
        <button class="btn bg2 sm" onclick="addTag('fb')">+</button></div></div>
    </div>

    <!-- Conditional: conditions + default -->
    <div id="strat-cond-opts" style="display:none">
      <div class="fi">
        <label data-i="cond_label">路由条件 <span class="hint" style="display:inline" data-i="cond_hint">（按顺序匹配，命中则路由到对应 target）</span></label>
        <div id="cond-list"></div>
        <button class="btn bg2 sm" style="width:100%;margin-top:4px" onclick="addCond()" data-i="add_cond">+ 添加条件</button>
      </div>
      <div class="fi"><label data-i="cond_default">默认 Target（无条件命中时）</label>
        <input type="text" id="cond-default" placeholder="target-default" oninput="upd()"></div>
    </div>

  </div>
</div>

<!-- ③ TARGETS -->
<div class="card" id="c-tgt">
  <div class="chd" onclick="toggleCard('c-tgt')">
    <div class="ct"><span class="ci">🎯</span><span data-i="c_tgt">目标 Targets</span> <span id="tgt-cnt" style="font-size:10px;color:var(--mu);font-weight:400;margin-left:4px"></span></div>
    <span class="chev">▼</span>
  </div>
  <div class="cbd">
    <div id="tgt-list"></div>
    <button class="btn bg2 sm" style="width:100%;margin-top:2px" onclick="addTgt()" data-i="add_tgt">+ 添加 Target</button>
  </div>
</div>

</div><!-- END FP -->

<!-- ══════════ OUTPUT PANEL ══════════ -->
<div class="op">
  <div class="tabs">
    <div class="tab on" onclick="switchTab('j')" data-i="tab_j">{ } JSON</div>
    <div class="tab" onclick="switchTab('d')" data-i="tab_d">⬡ 流程图</div>
  </div>
  <div class="tc on" id="tj">
    <div class="jv">
      <div class="jtb">
        <span class="lbl" data-i="j_lbl">Config JSON</span>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="cp-fb" style="font-size:11px;color:var(--ok);display:none" data-i="copied">✓ 已复制</span>
          <button class="btn bg2 sm" onclick="copyJSON()" data-i="copy_s">⎘ 复制</button>
        </div>
      </div>
      <pre id="jo"></pre>
    </div>
  </div>
  <div class="tc" id="td">
    <div class="dv"><svg id="dsvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
</div>
</div>

<script>
/* ════════════════════════════════════
   I18N
════════════════════════════════════ */
const L = {
zh:{

function i(k){ return (L[lang]||L.zh)[k] || (L.en[k]||k); }

function applyLang() {
  document.querySelectorAll('[data-i]').forEach(el => {
    el.textContent = i(el.getAttribute('data-i'));
  });
  document.querySelectorAll('[data-i-opt]').forEach(el => {
    const v = i(el.getAttribute('data-i-opt'));
    if (v !== el.getAttribute('data-i-opt')) el.textContent = v;
  });
  document.querySelectorAll('.lb').forEach(btn => {
    btn.classList.toggle('on', btn.getAttribute('onclick').includes(`'${lang}'`));
  });
  renderTargets(); renderGRs('input'); renderGRs('output'); renderConds();
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lb').forEach(btn =>
    btn.classList.toggle('on', btn.getAttribute('onclick').includes(`'${l}'`))
  );
  applyLang(); upd();
}

let nid = 1;

function mkTgt() {
  return { id: nid++, name: '', provider: '', weight: 1, request_timeout: '',
    on_status_codes: [],
    ovr_params: {}, ovr_open: false,
    def_params: {}, def_open: false,
    drop_params: [],
    retry_enabled: false, retry_attempts: 1, retry_on_status_codes: [] };
}
let tgts = [mkTgt()];

/* TAG HELPERS */
function initTag(g){ if(!tagSt[g]) tagSt[g]=[]; }
function getTag(g){ initTag(g); return tagSt[g]; }
function addTag(g){
  initTag(g);
  const inp = document.getElementById(g+'-in');
  const v = inp.value.trim();
  if (!v||tagSt[g].includes(v)){ inp.value=''; return; }
  tagSt[g].push(v); inp.value='';
  renderTag(g); upd();
}
function rmTag(g,v){ tagSt[g]=tagSt[g].filter(x=>x!==v); renderTag(g); upd(); }
function renderTag(g){
  const el = document.getElementById(g+'-tags'); if (!el) return;
  el.innerHTML = tagSt[g].map(v=>`<span class="tag">${esc(v)}<button onclick="rmTag('${g}','${v}')">×</button></span>`).join('');
}
function tagEnter(e,g){ if(e.key==='Enter'){e.preventDefault();addTag(g);} }

/* Target-scoped tags */
function addTTag(tid,g){
  const tgt = tgts.find(t=>t.id===tid); if (!tgt) return;
  const inp = document.getElementById(`t${tid}-${g}-in`); if (!inp) return;
  const v = inp.value.trim(); if (!v) return;
  const k = g.replace(/-/g,'_');
  if (!tgt[k].includes(v)) tgt[k].push(v);
  inp.value=''; renderTTag(tid,g); upd();
}
function rmTTag(tid,g,v){
  const tgt = tgts.find(t=>t.id===tid); if (!tgt) return;
  const k = g.replace(/-/g,'_');
  tgt[k]=tgt[k].filter(x=>x!==v);
  renderTTag(tid,g); upd();
}
function renderTTag(tid,g){
  const el = document.getElementById(`t${tid}-${g}-tags`); if (!el) return;
  const tgt = tgts.find(t=>t.id===tid);
  const arr = tgt ? tgt[g.replace(/-/g,'_')] : [];
  el.innerHTML = arr.map(v=>`<span class="tag">${esc(v)}<button onclick="rmTTag(${tid},'${g}','${v}')">×</button></span>`).join('');
}
function ttEnter(e,tid,g){ if(e.key==='Enter'){e.preventDefault();addTTag(tid,g);} }

/* TOGGLES */
function toggleCard(id){
  const c = document.getElementById(id);
  const bd = c.querySelector('.cbd'); if (!bd) return;
  bd.style.display = bd.style.display==='none' ? '' : 'none';
  c.querySelector('.chev').style.transform = bd.style.display==='none' ? 'rotate(-90deg)' : '';
}
function toggleSub(id){ document.getElementById(id).classList.toggle('cl'); }
function togFeat(f){
  feat[f]=!feat[f];
  document.getElementById('tog-'+f).classList.toggle('on', feat[f]);
  const sub = document.getElementById('s-'+f);
  if (feat[f]) sub.classList.remove('cl'); else sub.classList.add('cl');
  upd();
}

/* GUARDRAILS */
function addGR(type){ grs[type].push({id:'',deny:true,async:false}); renderGRs(type); }
function rmGR(type,idx){ grs[type].splice(idx,1); renderGRs(type); upd(); }
function renderGRs(type){
  const el = document.getElementById(type[0]+'gr-list'); if (!el) return;
  el.innerHTML = grs[type].map((g,idx)=>`
    <div style="display:grid;grid-template-columns:1fr auto auto auto;gap:5px;align-items:center;margin-bottom:5px">
      <input type="text" placeholder="${i('gr_id')}" value="${esc(g.id)}"
        oninput="grs['${type}'][${idx}].id=this.value;upd()">
      <select style="width:auto" onchange="grs['${type}'][${idx}].deny=this.value==='true';upd()">
        <option value="true"${g.deny?' selected':''}>${i('gr_deny')}</option>
        <option value="false"${!g.deny?' selected':''}>${i('gr_warn')}</option>
      </select>
      <select style="width:auto" onchange="grs['${type}'][${idx}].async=this.value==='true';upd()">
        <option value="false">${i('gr_sync')}</option>
        <option value="true">${i('gr_async')}</option>
      </select>
      <button class="ic" onclick="rmGR('${type}',${idx})">🗑</button>
    </div>`).join('');
}

/* CONDITIONS */
function addCond(){ conds.push({logic:'',field:'metadata.',op:'$eq',value:'',then:'',subconds:[]}); renderConds(); }
function rmCond(idx){ conds.splice(idx,1); renderConds(); upd(); }
function setCondLogic(ci,val){
  conds[ci].logic=val;
  if ((val==='$and'||val==='$or')&&!(conds[ci].subconds||[]).length)
    conds[ci].subconds=[{field:'metadata.',op:'$eq',value:''}];
  renderConds(); upd();
}
function addSubCond(ci){ (conds[ci].subconds=conds[ci].subconds||[]).push({field:'metadata.',op:'$eq',value:''}); renderConds(); upd(); }
function rmSubCond(ci,si){ conds[ci].subconds.splice(si,1); renderConds(); upd(); }
function setSubCond(ci,si,k,v){ conds[ci].subconds[si][k]=v; upd(); }
function parseCondVal(op,v){
  if (op==='$in'||op==='$nin') return v.split(',').map(x=>x.trim()).filter(Boolean);
  if (op==='$regex') return v;
  const n=Number(v);
  return (v!==''&&!isNaN(n)) ? n : v;
}
function renderConds(){
  const el = document.getElementById('cond-list'); if (!el) return;
  const OPS = ['$eq','$ne','$in','$nin','$gt','$gte','$lt','$lte','$regex'];
  const opSel=(val,onChange)=>`<select onchange="${onChange};upd()">${OPS.map(op=>`<option value="${op}"${val===op?' selected':''}>${op}</option>`).join('')}</select>`;
  const logicSel=(c,ci)=>`<select onchange="setCondLogic(${ci},this.value)">
    <option value=""${!c.logic?' selected':''}>simple</option>
    <option value="$and"${c.logic==='$and'?' selected':''}>$and</option>
    <option value="$or"${c.logic==='$or'?' selected':''}>$or</option>
  </select>`;
  const bd='border-color:var(--req-bd)';
  el.innerHTML = conds.map((c,ci)=>{
    const isLogic=c.logic==='$and'||c.logic==='$or';
    const lSel=`<select class="logic-sel" onchange="setCondLogic(${ci},this.value)">
      <option value=""${!c.logic?' selected':''}>simple</option>
      <option value="$and"${c.logic==='$and'?' selected':''}>$and</option>
      <option value="$or"${c.logic==='$or'?' selected':''}>$or</option>
    </select>`;
    const thenIn=`<input type="text" value="${esc(c.then)}" placeholder="target-name" title="${i('cond_then')} *" style="${c.then?'':bd}" oninput="conds[${ci}].then=this.value;this.style.borderColor=this.value?'':'var(--req-bd)';upd()">`;
    let body;
    if (isLogic){
      const subRows=(c.subconds||[]).map((s,si)=>`
        <div class="cond-sub">
          <input type="text" value="${esc(s.field)}" placeholder="metadata.x-tier" oninput="setSubCond(${ci},${si},'field',this.value)">
          ${opSel(s.op,`setSubCond(${ci},${si},'op',this.value)`)}
          <input type="text" value="${esc(s.value)}" placeholder="value" oninput="setSubCond(${ci},${si},'value',this.value)">
          <button class="ic" onclick="rmSubCond(${ci},${si})">−</button>
        </div>`).join('');
      body=`${subRows}
        <button class="btn bg2 sm" style="width:100%;margin-top:2px;margin-bottom:8px" onclick="addSubCond(${ci})">+ ${i('add_subcond')}</button>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center">
          <span style="font-size:11px;color:var(--t2);white-space:nowrap">${i('cond_then')}</span>${thenIn}
        </div>`;
    } else {
      body=`<div class="cond-simple">
        <input type="text" value="${esc(c.field)}" placeholder="metadata.x-task" title="${i('cond_field')} *" style="${c.field?'':bd}" oninput="conds[${ci}].field=this.value;this.style.borderColor=this.value?'':'var(--req-bd)';upd()">
        ${opSel(c.op,`conds[${ci}].op=this.value`)}
        <input type="text" value="${esc(c.value)}" placeholder="value" title="${i('cond_val')} *" style="${c.value?'':bd}" oninput="conds[${ci}].value=this.value;this.style.borderColor=this.value?'':'var(--req-bd)';upd()">
        ${thenIn}
      </div>`;
    }
    return `<div class="cond-block">
      <div class="cond-head">
        <div style="display:flex;align-items:center;gap:0">
          <span class="cond-num">Condition ${ci+1}</span>${lSel}
        </div>
        <button class="ic" onclick="rmCond(${ci})">×</button>
      </div>
      ${body}
    </div>`;
  }).join('');
}

/* ════════════════════════════════════
   PARAM HELPERS
════════════════════════════════════ */
function pDefault(p){
  const s=PS[p]; if(!s) return '';
  if(s.t==='bool') return false;
  if(s.t==='slider') return parseFloat(((s.min+s.max)/2).toFixed(2));
  if(s.t==='tags'||s.t==='kv') return [];
  if(s.t==='compound'){
    const v={};
    s.sub.forEach(sf=>{ if(!sf.showIf){
      if(sf.t==='select') v[sf.k]=sf.default||sf.opts[0];
      else if(sf.t==='bool') v[sf.k]=false;
      else v[sf.k]='';
    }});
    return v;
  }
  return '';
}

function togPicker(tid,f){ const t=tgts.find(x=>x.id===tid); if(!t)return;
  const k=f==='ovr_params'?'ovr_open':'def_open'; t[k]=!t[k]; renderTargets(); }
function togParam(tid,f,p){ const t=tgts.find(x=>x.id===tid); if(!t)return;
  if(t[f][p]!==undefined) delete t[f][p]; else t[f][p]=pDefault(p);
  renderTargets(); upd(); }
function setPV(tid,f,p,v){ const t=tgts.find(x=>x.id===tid); if(!t)return; t[f][p]=v; upd(); }
function setPSub(tid,f,p,sk,v){ const t=tgts.find(x=>x.id===tid); if(!t)return;
  if(typeof t[f][p]!=='object'||!t[f][p]) t[f][p]={};
  t[f][p][sk]=v;
  const spec=PS[p];
  if(spec&&spec.t==='compound'&&spec.sub.some(s=>s.showIf&&s.showIf[sk]!==undefined)) renderTargets();
  upd(); }
function addPTag(tid,f,p,uid){ const t=tgts.find(x=>x.id===tid); if(!t)return;
  const el=document.getElementById(uid+'-tin'); if(!el)return;
  const v=el.value.trim(); if(!v)return;
  if(!Array.isArray(t[f][p]))t[f][p]=[];
  t[f][p].push(v); el.value='';
  const te=document.getElementById(uid+'-tgs');
  if(te) te.innerHTML=t[f][p].map((x,i)=>`<span class="tag">${esc(x)}<button onclick="rmPTag(${tid},'${f}','${p}',${i})">×</button></span>`).join('');
  upd(); }
function rmPTag(tid,f,p,i){ const t=tgts.find(x=>x.id===tid); if(!t)return; t[f][p].splice(i,1); renderTargets(); upd(); }
function addPKV(tid,f,p){ const t=tgts.find(x=>x.id===tid); if(!t)return;
  if(!Array.isArray(t[f][p]))t[f][p]=[];
  t[f][p].push({k:'',v:''}); renderTargets(); }
function rmPKV(tid,f,p,i){ const t=tgts.find(x=>x.id===tid); if(!t)return; t[f][p].splice(i,1); renderTargets(); upd(); }
function setPKV(tid,f,p,i,k,v){ const t=tgts.find(x=>x.id===tid); if(!t)return; t[f][p][i][k]=v; upd(); }

function renderPCtrl(tid,f,p,val){
  const s=PS[p]; if(!s)return '';
  const uid=`pc-${tid}-${f}-${p}`.replace(/[^a-z0-9-]/g,'_');
  let c='';
  switch(s.t){
    case 'text':
      c=`<input type="text" value="${esc(String(val||''))}" placeholder="${esc(s.ph||'')}" oninput="setPV(${tid},'${f}','${p}',this.value)">`;break;
    case 'textarea':
      c=`<textarea rows="2" placeholder="${esc(s.ph||'')}" oninput="setPV(${tid},'${f}','${p}',this.value)" style="resize:vertical">${esc(String(val||''))}</textarea>`;break;
    case 'number':
      c=`<input type="number" value="${val!==undefined&&val!==''?val:''}" placeholder="${esc(s.ph||'')}" ${s.min!==undefined?`min="${s.min}"`:''}  ${s.max!==undefined?`max="${s.max}"`:''}
        oninput="setPV(${tid},'${f}','${p}',this.value===''?'':Number(this.value))">`;break;
    case 'slider':{
      const sv=val!==undefined&&val!==''?Number(val):(s.min+s.max)/2;
      c=`<div class="srow">
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step||0.01}" value="${sv}"
          oninput="setPV(${tid},'${f}','${p}',parseFloat(this.value));document.getElementById('${uid}sv').textContent=parseFloat(this.value).toFixed(2)">
        <span id="${uid}sv" class="sval">${sv.toFixed(2)}</span>
      </div>`;break;}
    case 'bool':
      c=`<select onchange="setPV(${tid},'${f}','${p}',this.value==='true')">
        <option value="true"${val===true?' selected':''}>true</option>
        <option value="false"${val!==true?' selected':''}>false</option>
      </select>`;break;
    case 'enum_txt':{
      const known=s.opts.includes(String(val));
      c=`<div class="trow" style="gap:5px">
        <select style="width:auto" onchange="setPV(${tid},'${f}','${p}',this.value)">
          ${s.opts.map(o=>`<option value="${o}"${val===o?' selected':''}>${o}</option>`).join('')}
          <option value="" ${!known&&val?'selected':''}>custom</option>
        </select>
        <input type="text" value="${!known&&val?esc(String(val)):''}" placeholder="${esc(s.ph||'')}"
          oninput="setPV(${tid},'${f}','${p}',this.value)" style="${!known&&val?'':'display:none'}" id="${uid}cust">
      </div>`;break;}
    case 'tags':{
      const ta=Array.isArray(val)?val:[];
      c=`<div><div class="tags" id="${uid}-tgs">${ta.map((x,i)=>`<span class="tag">${esc(x)}<button onclick="rmPTag(${tid},'${f}','${p}',${i})">×</button></span>`).join('')}</div>
      <div class="trow"><input id="${uid}-tin" type="text" placeholder="${esc(s.ph||'')}" onkeydown="if(event.key==='Enter'){event.preventDefault();addPTag(${tid},'${f}','${p}','${uid}')}">
      <button class="btn bg2 sm" onclick="addPTag(${tid},'${f}','${p}','${uid}')">+</button></div></div>`;break;}
    case 'compound':{
      const cv=typeof val==='object'&&val?val:{};
      // init type to first option if unset
      if(cv.type===undefined&&s.sub[0]&&s.sub[0].k==='type') cv.type=s.sub[0].opts[0];
      c=`<div class="subrows">${s.sub.map(sf=>{
        if(sf.showIf&&!Object.entries(sf.showIf).every(([k,v])=>cv[k]===v))return '';
        const sv2=cv[sf.k];
        let sc='';
        if(sf.t==='select') sc=`<select onchange="setPSub(${tid},'${f}','${p}','${sf.k}',this.value)">${sf.opts.map(o=>`<option value="${o}"${sv2===o?' selected':''}>${o}</option>`).join('')}</select>`;
        else if(sf.t==='bool') sc=`<select onchange="setPSub(${tid},'${f}','${p}','${sf.k}',this.value==='true')"><option value="false"${sv2!==true?' selected':''}>false</option><option value="true"${sv2===true?' selected':''}>true</option></select>`;
        else sc=`<input type="${sf.t==='number'?'number':'text'}" value="${esc(String(sv2||''))}" placeholder="${esc(sf.ph||'')}" ${sf.min!==undefined?`min="${sf.min}"`:''}
          oninput="setPSub(${tid},'${f}','${p}','${sf.k}',this.value)">`;
        return `<div class="subrow"><label>${esc(sf.k.split('.').pop())}</label>${sc}</div>`;
      }).join('')}</div>`;break;}
    case 'kv':{
      const kva=Array.isArray(val)?val:[];
      c=`<div class="pkv-rows" id="${uid}-kvl">${kva.map((kv,ki)=>`<div class="pkv-r">
        <input type="text" placeholder="${esc(s.ph_k||'key')}" value="${esc(String(kv.k||''))}" oninput="setPKV(${tid},'${f}','${p}',${ki},'k',this.value)">
        <input type="text" placeholder="${esc(s.ph_v||'value')}" value="${esc(String(kv.v||''))}" oninput="setPKV(${tid},'${f}','${p}',${ki},'v',this.value)">
        <button class="ic" onclick="rmPKV(${tid},'${f}','${p}',${ki})">×</button>
      </div>`).join('')}</div>
      <button class="btn bg2 sm" style="margin-top:4px" onclick="addPKV(${tid},'${f}','${p}')">+</button>`;break;}
  }
  return `<div class="pctl"><div class="pctl-hd">
    <span class="pctl-k">${esc(p)}</span>
    <span class="pctl-grp">${esc(s.g)}</span>
    <button class="pctl-rm" onclick="togParam(${tid},'${f}','${p}')">×</button>
  </div>${c}</div>`;
}

function renderPPicker(tid,f,sel){
  const groups={};
  Object.entries(PS).forEach(([k,s])=>{ if(!groups[s.g])groups[s.g]=[]; groups[s.g].push(k); });
  return `<div class="ppanel"><div class="pgroups">${Object.entries(groups).map(([g,ps])=>`
    <div><div class="pgroup-hd">${esc(g)}</div>
    ${ps.map(p=>`<div class="ptag${sel[p]!==undefined?' on':''}" onclick="togParam(${tid},'${f}','${p}')">
      ${sel[p]!==undefined?'✓':'+'}  ${esc(p)}</div>`).join('')}
    </div>`).join('')}
  </div></div>`;
}

function renderPSection(tid,f,tgt,label,hint){
  const sel=tgt[f]||{};
  const openKey=f==='ovr_params'?'ovr_open':'def_open';
  const pHtml=Object.entries(sel).map(([p,v])=>renderPCtrl(tid,f,p,v)).join('');

    ${pHtml}

  </div>`;
}

function rmTgt(id){

function togTRetry(tid){ const tgt=tgts.find(t=>t.id===tid); if (!tgt) return; tgt.retry_enabled=!tgt.retry_enabled; renderTargets(); upd(); }

            oninput="tgts.find(x=>x.id==${tgt.id}).name=this.value;var l=document.querySelector('#tc-${tgt.id} .tnum');if(l)l.textContent=this.value||'${i('lbl_target')} ${idx+1}';this.style.borderColor=this.value?'':'var(--req-bd)';upd()"
            style="${!tgt.name?'border-color:var(--req-bd)':''}">
          <div class="hint">${i('t_name_h')}</div></div>`:``}
        <div class="${isSingle?'':'r2'}">
          <div class="fi"><label>${i('t_prov')}<span class="req">*</span></label>
            <input type="text" placeholder="@my-virtual-key" value="${esc(tgt.provider)}"

              style="${!tgt.provider?'border-color:var(--req-bd)':''}">

          ${!isSingle?`<div class="fi"><label>${i('t_timeout')}</label>

              oninput="tgts.find(x=>x.id==${tgt.id}).request_timeout=this.value;upd()"></div>`:''}
        </div>
        ${isLB?`
        <div class="fi"><label>${i('t_weight')}<span class="req">*</span></label>
          <input type="number" placeholder="1" min="0" step="0.1" value="${tgt.weight!==''?tgt.weight:1}"
            oninput="tgts.find(x=>x.id==${tgt.id}).weight=this.value;upd()">

          <div class="tags" id="t${tgt.id}-drop_params-tags">${tgt.drop_params.map(v=>`<span class="tag">${esc(v)}<button onclick="rmTTag(${tgt.id},'drop_params','${v}')">×</button></span>`).join('')}</div>

              <div class="trow"><input id="t${tgt.id}-retry_on_status_codes-in" type="number" placeholder="500" onkeydown="ttEnter(event,${tgt.id},'retry_on_status_codes')">
              <button class="btn bg2 sm" onclick="addTTag(${tgt.id},'retry_on_status_codes')">+</button></div></div>
          </div>`:''}
        </div>`:''}

      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════
   BUILD CONFIG
════════════════════════════════════ */
function pv(v){
  if(v==='true')return true; if(v==='false')return false;
  if(v!==''&&!isNaN(v))return Number(v); return v;
}

function buildCfg(){
  const mode = document.getElementById('strat-mode').value;
  const out = {};

  // retry
  if (feat.retry){
    const a = document.getElementById('retry-attempts').value;
    const ua = document.getElementById('retry-after').value==='true';
    const rc = getTag('rc').map(Number);
    out.retry = { attempts: Number(a) };
    if (rc.length) out.retry.on_status_codes = rc;
    if (ua) out.retry.use_retry_after_headers = true;
  }

  // cache
  if (feat.cache){
    const cm = document.getElementById('cache-mode').value;
    const ma = document.getElementById('cache-age').value;
    out.cache = { mode: cm };
    if (ma) out.cache.max_age = Number(ma);
  }

  // cb_config
  if (feat.cb){
    const cb = {};
    const thr = document.getElementById('cb-thresh').value;
    const pct = document.getElementById('cb-pct').value;
    const cool = document.getElementById('cb-cool').value;
    const mr = document.getElementById('cb-minreq').value;
    const cc = getTag('cbc').map(Number);
    if (pct) cb.failure_threshold_percentage = Number(pct);
    else if (thr) cb.failure_threshold = Number(thr);
    if (cool) cb.cooldown_interval = Number(cool);
    if (mr) cb.minimum_requests = Number(mr);
    if (cc.length) cb.failure_status_codes = cc;
    out.cb_config = cb;
  }

  // request_timeout, forward_headers
  const to = document.getElementById('g-timeout').value;
  if (to) out.request_timeout = Number(to);
  const fh = getTag('fh');
  if (fh.length) out.forward_headers = fh;

  // guardrails
  const ig = grs.input.filter(g=>g.id);
  if (ig.length) out.input_guardrails = ig.map(g=>{ const o={id:g.id,deny:g.deny}; if(g.async)o.async=true; return o; });
  const og = grs.output.filter(g=>g.id);
  if (og.length) out.output_guardrails = og.map(g=>{ const o={id:g.id,deny:g.deny}; if(g.async)o.async=true; return o; });

  // strategy
  if (mode !== 'single' && mode !== 'none') {
    out.strategy = { mode };
    if (mode === 'fallback') {
      const sc = getTag('fb').map(Number);
      if (sc.length) out.strategy.on_status_codes = sc;
    }
    if (mode === 'conditional') {
      const condDef = document.getElementById('cond-default').value.trim();
      const condArr = conds.filter(c=>c.then).map(c=>{
        let query;
        if (c.logic==='$and'||c.logic==='$or'){
          const subs=(c.subconds||[]).filter(s=>s.field).map(s=>({[s.field]:{[s.op]:parseCondVal(s.op,s.value)}}));
          query=subs.length?{[c.logic]:subs}:{};
        } else {
          query=c.field?{[c.field]:{[c.op]:parseCondVal(c.op,c.value)}}:{};
        }
        return {query,then:c.then};
      });
      if (condArr.length) out.strategy.conditions = condArr;
      if (condDef) out.strategy.default = condDef;
    }
  }

  // targets / single root fields
  if (mode === 'none') {
    // no targets, no strategy
  } else if (mode === 'single') {
    const tgt = tgts[0];
    if (tgt) {
      if (tgt.provider) out.provider = tgt.provider;
      const ov = serPS(tgt.ovr_params); if (Object.keys(ov).length) out.override_params = ov;
      const df = serPS(tgt.def_params); if (Object.keys(df).length) out.default_params = df;
      if (tgt.drop_params.length) out.drop_params = tgt.drop_params;
    }
  } else {
    const hasContent = tgts.some(t=>t.provider||t.name||Object.keys(t.ovr_params).length||Object.keys(t.def_params).length);
    if (hasContent || tgts.length>1){
      out.targets = tgts.map(tgt=>{
        const o = {};
        if (tgt.name) o.name = tgt.name;
        if (tgt.provider) o.provider = tgt.provider;
        if (mode==='loadbalance'&&tgt.weight!==''&&tgt.weight!==null) o.weight=Number(tgt.weight);
        if (tgt.request_timeout) o.request_timeout=Number(tgt.request_timeout);
        if (mode==='fallback'&&tgt.on_status_codes.length) o.on_status_codes=tgt.on_status_codes.map(Number);
        const ov=serPS(tgt.ovr_params); if(Object.keys(ov).length) o.override_params=ov;
        const df=serPS(tgt.def_params); if(Object.keys(df).length) o.default_params=df;
        if (tgt.drop_params.length) o.drop_params=tgt.drop_params;
        if (tgt.retry_enabled){ o.retry={attempts:Number(tgt.retry_attempts)}; if(tgt.retry_on_status_codes.length)o.retry.on_status_codes=tgt.retry_on_status_codes.map(Number); }
        return o;
      });
    }
  }
  return stripEmpty(out);
}

function stripEmpty(v){
  if (Array.isArray(v)) return v.map(stripEmpty);
  if (v !== null && typeof v === 'object'){
    const o = {};
    for (const [k,val] of Object.entries(v)){
      const s = stripEmpty(val);
      if (s !== null && typeof s === 'object' && !Array.isArray(s) && Object.keys(s).length === 0) continue;
      o[k] = s;
    }
    return o;
  }
  return v;
}

function serPS(params){
  const out={};
  Object.entries(params).forEach(([p,val])=>{
    const s=PS[p];
    if(!s){ if(val!==undefined&&val!=='') out[p]=pv(String(val)); return; }
    switch(s.t){
      case 'number': if(val!==''&&val!==undefined&&val!==null) out[p]=Number(val); break;
      case 'slider': if(val!==undefined&&val!==null&&val!=='') out[p]=parseFloat(Number(val).toFixed(4)); break;
      case 'bool': out[p]=val===true||val==='true'; break;
      case 'tags': if(Array.isArray(val)&&val.length) out[p]=val; break;
      case 'kv': if(Array.isArray(val)){const o2={};val.filter(kv=>kv.k).forEach(kv=>o2[kv.k]=pv(String(kv.v)));if(Object.keys(o2).length)out[p]=o2;} break;
      case 'compound':
        if(p==='response_format'){
          const v=val||{}; const rf={type:v.type||'text'};
          if(v.type==='json_schema'){rf.json_schema={};if(v['json_schema.name'])rf.json_schema.name=v['json_schema.name'];if(v['json_schema.strict']===true)rf.json_schema.strict=true;}
          out[p]=rf;
        } else if(p==='thinking'){
          const v=val||{}; const t2={type:v.type||'enabled'};
          if(v.type==='enabled'&&v.budget_tokens) t2.budget_tokens=Number(v.budget_tokens);
          out[p]=t2;
        } else { out[p]=val; }
        break;
      default: if(val!==undefined&&val!=='') out[p]=val;
    }
  });
  return out;
}

function hl(obj){
  const j = JSON.stringify(obj,null,2);
  return j.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m=>{
    if(/^"/.test(m)) return/:$/.test(m)?`<span class="jk">${m}</span>`:`<span class="js">${m}</span>`;
    if(/true|false/.test(m)) return `<span class="jb">${m}</span>`;
    if(/null/.test(m)) return `<span class="jnull">${m}</span>`;
    return `<span class="jn">${m}</span>`;
  });
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  dirty = true;

function validateCfg(){
  const mode = document.getElementById('strat-mode').value;
  const warns = [];
  if (mode === 'none'){
    // no required fields
  } else if (mode === 'single'){
    if (!tgts[0]?.provider) warns.push('Provider is required');
  } else {
    tgts.forEach((t,idx)=>{
      const n = idx+1;
      if (!t.provider) warns.push(`Target ${n}: Provider is required`);
      if (mode === 'conditional' && !t.name) warns.push(`Target ${n}: Name is required (used in conditions)`);
    });
    if (mode === 'conditional'){
      conds.forEach((c,idx)=>{
        const n = idx+1;
        if (c.logic==='$and'||c.logic==='$or'){
          if (!(c.subconds||[]).some(s=>s.field)) warns.push(`Condition ${n}: At least one sub-condition with a field is required`);
        } else {
          if (!c.field) warns.push(`Condition ${n}: Field path is required`);
          if (!c.value) warns.push(`Condition ${n}: Value is required`);
        }
        if (!c.then) warns.push(`Condition ${n}: Target (then) is required`);
      });
    }
  }
  return warns;
}

function copyJSON(){
  const warns = validateCfg();
  if (warns.length && !confirm('Missing required fields:\n• ' + warns.join('\n• ') + '\n\nCopy anyway?')) return;
  navigator.clipboard.writeText(JSON.stringify(buildCfg(),null,2)).then(()=>{
    const fb=document.getElementById('cp-fb');
    fb.style.display='inline'; setTimeout(()=>fb.style.display='none',1800);
  });
}

function handleImport(e){

  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {

/* reverse of serPS: Portkey params → internal state object.
   Compound params store their internal state as an object with dot-notation sub-keys,
   e.g. ovr_params['response_format'] = {type:'json_schema','json_schema.name':'resp'}  */
function deserPS(params){
  if (!params || typeof params !== 'object') return {};
  const st = {};
  for (const [k,v] of Object.entries(params)){
    const spec = PS[k];
    if (!spec){ st[k] = v; continue; }
    if (spec.t === 'compound'){
      const inner = {};
      for (const sub of (spec.sub||[])){
        const parts = sub.k.split('.');
        let val;
        if (parts.length === 1){ val = (typeof v==='object'&&v) ? v[parts[0]] : undefined; }
        else if (parts.length === 2){ val = (typeof v==='object'&&v&&typeof v[parts[0]]==='object'&&v[parts[0]]) ? v[parts[0]][parts[1]] : undefined; }
        if (val !== undefined) inner[sub.k] = val;
      }
      st[k] = inner;
    } else if (spec.t === 'kv'){
      st[k] = Object.entries(v||{}).map(([ek,ev])=>({k:ek,v:String(ev)}));
    } else if (spec.t === 'tags'){
      st[k] = Array.isArray(v) ? [...v] : [];
    } else {
      st[k] = v;
    }
  }
  return st;
}

function setFeat(f, on){
  feat[f] = on;
  document.getElementById('tog-'+f).classList.toggle('on', on);
  const sub = document.getElementById('s-'+f);
  if (on) sub.classList.remove('cl'); else sub.classList.add('cl');
}

function importCfg(cfg){
  /* ── retry ── */
  const rt = cfg.retry||{};
  const hasRetry = !!rt.attempts;
  setFeat('retry', hasRetry);
  if (hasRetry){
    document.getElementById('retry-attempts').value = rt.attempts;
    if (rt.use_retry_after_headers !== undefined)
      document.getElementById('retry-after').value = rt.use_retry_after_headers ? 'true' : 'false';
  }
  tagSt['rc'] = (rt.on_status_codes||[]).map(String);
  renderTag('rc');

  /* ── cache ── */
  const ca = cfg.cache||{};
  const hasCache = !!ca.mode;
  setFeat('cache', hasCache);
  if (hasCache){
    document.getElementById('cache-mode').value = ca.mode;
    document.getElementById('cache-age').value = ca.max_age !== undefined ? ca.max_age : '';
  }

  /* ── circuit breaker ── */
  const cbCfg = cfg.cb_config||{};
  const hasCb = Object.keys(cbCfg).length > 0;
  setFeat('cb', hasCb);
  if (hasCb){
    if (cbCfg.failure_threshold !== undefined) document.getElementById('cb-thresh').value = cbCfg.failure_threshold;
    if (cbCfg.failure_threshold_percentage !== undefined) document.getElementById('cb-pct').value = cbCfg.failure_threshold_percentage;
    if (cbCfg.cooldown_interval !== undefined) document.getElementById('cb-cool').value = cbCfg.cooldown_interval;
    if (cbCfg.minimum_requests !== undefined) document.getElementById('cb-minreq').value = cbCfg.minimum_requests;
    tagSt['cbc'] = (cbCfg.failure_status_codes||[]).map(String);
    renderTag('cbc');
  }

  /* ── request timeout ── */
  const toEl = document.getElementById('g-timeout');
  if (toEl) toEl.value = cfg.request_timeout !== undefined ? cfg.request_timeout : '';

  /* ── forward headers ── */
  tagSt['fh'] = Array.isArray(cfg.forward_headers) ? [...cfg.forward_headers] : [];
  renderTag('fh');

  /* ── guardrails ── */
  grs.input.length = 0;
  grs.output.length = 0;
  const igSrc = cfg.input_guardrails||[];
  for (const g of igSrc) grs.input.push({id:g.id||'', deny:g.deny!==false, async:!!g.async});
  const ogSrc = cfg.output_guardrails||[];
  for (const g of ogSrc) grs.output.push({id:g.id||'', deny:g.deny!==false, async:!!g.async});
  renderGRs('input'); renderGRs('output');

  /* ── strategy ── */
  const strat = cfg.strategy||{};
  const hasTargets = Array.isArray(cfg.targets)&&cfg.targets.length>0;
  const hasProvider = !!cfg.provider;
  const smode = strat.mode || (hasTargets ? 'fallback' : hasProvider ? 'single' : 'none');
  document.getElementById('strat-mode').value = smode;
  onModeChange();

  /* fallback codes */
  tagSt['fb'] = Array.isArray(strat.on_status_codes) ? strat.on_status_codes.map(String) : [];
  renderTag('fb');

  /* conditions */
  conds.length = 0;
  if (smode === 'conditional' && Array.isArray(strat.conditions)){
    for (const c of strat.conditions){
      const q = c.query||{};
      const firstKey = Object.keys(q)[0]||'';
      if (firstKey==='$and'||firstKey==='$or'){
        const subconds=(q[firstKey]||[]).map(sub=>{
          const f=Object.keys(sub)[0]||'';
          const opObj=f?(sub[f]||{}):{};
          const op=Object.keys(opObj)[0]||'$eq';
          const raw=f?opObj[op]:'';
          return {field:f, op, value:Array.isArray(raw)?raw.join(','):String(raw??'')};
        });
        conds.push({logic:firstKey, field:'', op:'$eq', value:'', then:c.then||'', subconds});
      } else {
        const opObj=firstKey?(q[firstKey]||{}):{};
        const op=Object.keys(opObj)[0]||'$eq';
        const raw=firstKey?opObj[op]:'';
        const value=Array.isArray(raw)?raw.join(','):String(raw??'');
        conds.push({logic:'', field:firstKey, op, value, then:c.then||'', subconds:[]});
      }
    }
  }
  const condDef = document.getElementById('cond-default');
  if (condDef) condDef.value = strat.default||'';
  renderConds();

  /* ── targets ── */
  tgts.length = 0;
  if (smode === 'single'){
    /* root-level fields → single target */
    tgts.push({
      id: nid++, name: '',
      provider: cfg.provider||cfg.virtual_key||'',
      weight: 1,
      request_timeout: cfg.request_timeout !== undefined ? cfg.request_timeout : '',
      on_status_codes: [],
      ovr_params: deserPS(cfg.override_params||{}), ovr_open: false,
      def_params: deserPS(cfg.default_params||{}), def_open: false,
      drop_params: Array.isArray(cfg.drop_params) ? [...cfg.drop_params] : [],
      retry_enabled: !!(cfg.retry&&cfg.retry.attempts),
      retry_attempts: (cfg.retry&&cfg.retry.attempts)||1,
      retry_on_status_codes: (cfg.retry&&cfg.retry.on_status_codes)||[],
    });
  } else {
    const srcts = Array.isArray(cfg.targets) ? cfg.targets : [];
    for (const t of srcts){
      tgts.push({
        id: nid++,
        name: t.name||'',
        provider: t.provider||t.virtual_key||'',
        weight: t.weight !== undefined ? t.weight : 1,
        request_timeout: t.request_timeout !== undefined ? t.request_timeout : '',
        on_status_codes: Array.isArray(t.on_status_codes) ? [...t.on_status_codes] : [],
        ovr_params: deserPS(t.override_params||{}), ovr_open: false,
        def_params: deserPS(t.default_params||{}), def_open: false,
        drop_params: Array.isArray(t.drop_params) ? [...t.drop_params] : [],
        retry_enabled: !!(t.retry&&t.retry.attempts),
        retry_attempts: (t.retry&&t.retry.attempts)||1,
        retry_on_status_codes: (t.retry&&t.retry.on_status_codes)||[],
      });
    }
  }
  if (tgts.length === 0) tgts.push(mkTgt());
  renderTargets();
  upd();
  dirty = false;
}

/* ════════════════════════════════════
   DIAGRAM
════════════════════════════════════ */
const DW = 600, PAD = 24, NW = 200, NH = 44, MW = 150, MH = 38, GAP = 56;
const COL = {
  primary:{ f:'#1a2e4a', s:'#3b82f6', t:'#93c5fd' },
  success:{ f:'#0f2e1a', s:'#10b981', t:'#6ee7b7' },
  danger: { f:'#2e0f0f', s:'#ef4444', t:'#fca5a5' },
  warn:   { f:'#2e1f0f', s:'#f59e0b', t:'#fcd34d' },
  neutral:{ f:'#1a1f2e', s:'#4b5563', t:'#9ca3af' },
  guard:  { f:'#1f1a2e', s:'#a855f7', t:'#d8b4fe' },
  cond:   { f:'#1a2a1a', s:'#10b981', t:'#6ee7b7' },
};

function mkN(x,y,w,h,lines,color){
  const c=COL[color]||COL.primary, rx=10, cx=x+w/2;
  const arr=typeof lines==='string'?lines.split('\n'):lines;
  const lh=16, th=arr.length*lh, sy=y+h/2-th/2+lh/2;
  const txt=arr.map((l,i)=>`<text x="${cx}" y="${sy+i*lh}" fill="${c.t}" font-size="${i===0?13:10}" font-weight="${i===0?'600':'400'}" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif" opacity="${i===0?1:0.8}">${esc(l)}</text>`).join('');
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${c.f}" stroke="${c.s}" stroke-width="1.5"/>${txt}`;
}

function mkA(x1,y1,x2,y2,label,color='#4b6cb7'){
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const path=Math.abs(x1-x2)<2?`M${x1},${y1} L${x2},${y2}`:`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
  let lbl='';
  if (label){
    const lw=String(label).length*6.5+12;
    lbl=`<rect x="${mx-lw/2}" y="${my-9}" width="${lw}" height="18" rx="4" fill="#1e2536" stroke="#3b4a6b"/>
    <text x="${mx}" y="${my+1}" fill="#7dd3fc" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${esc(label)}</text>`;
  }
  return `<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="${color}"/></marker></defs>
  <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" marker-end="url(#ar)"/>${lbl}`;
}

function mkChips(x,y,codes,fill='#1e2536',stroke='#3b4a6b',tc='#7dd3fc'){
  let out='',cx=x;
  codes.forEach(c=>{const w=String(c).length*7+12;out+=`<rect x="${cx}" y="${y}" width="${w}" height="18" rx="4" fill="${fill}" stroke="${stroke}"/><text x="${cx+w/2}" y="${y+9}" fill="${tc}" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${esc(c)}</text>`;cx+=w+4;});
  return out;
}

function renderDiag(cfg){
  const svg = document.getElementById('dsvg');
  const mode=document.getElementById('strat-mode').value;
  const hasIG=(cfg.input_guardrails||[]).length>0;
  const hasOG=(cfg.output_guardrails||[]).length>0;
  const hasCB=!!cfg.cb_config;
  const ts=cfg.targets||[];

  let els='', cy=PAD;
  const mid=DW/2, ncx=mid-NW/2;

  // Request
  els+=mkN(ncx,cy,NW,NH,i('d_req'),'neutral');
  let px=mid,py=cy+NH; cy+=NH+GAP;

  // Right-side info boxes: Retry → Cache → CB (matches UI order), all right-aligned
  const hasRetry=!!(cfg.retry&&cfg.retry.attempts);
  const hasCache=!!(cfg.cache&&cfg.cache.mode);
  const RX=DW-MW-6;
  let ry=PAD;

  if (hasRetry){
    const rt=cfg.retry;
    const codes=(rt.on_status_codes||[]).slice(0,3);
    const codeSuf=rt.on_status_codes&&rt.on_status_codes.length>3?' …':'';
    const rtSub=`${rt.attempts} attempts${codes.length?' / '+codes.join(',')+codeSuf:''}`;
    els+=mkN(RX,ry,MW,MH,[i('d_retry'),rtSub],'primary');
    els+=`<line x1="${RX}" y1="${ry+MH/2}" x2="${ncx+NW}" y2="${PAD+NH/2}" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>`;
    ry+=MH+8;
  }

  if (hasCache){
    const ca=cfg.cache;
    const caSub=ca.max_age?`${ca.mode} / ${ca.max_age}s`:ca.mode;
    els+=mkN(RX,ry,MW,MH,[i('d_cache'),caSub],'success');
    els+=`<line x1="${RX}" y1="${ry+MH/2}" x2="${ncx+NW}" y2="${PAD+NH/2}" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>`;
    ry+=MH+8;
  }

  if (hasCB){
    const cb=cfg.cb_config;
    const sub=cb.failure_threshold_percentage?`${cb.failure_threshold_percentage}% → ${(cb.cooldown_interval||60000)/1000}s cd`:`${cb.failure_threshold||3} fails → ${(cb.cooldown_interval||60000)/1000}s cd`;
    els+=mkN(RX,ry,MW,MH,[i('d_cb'),sub],'warn');
    els+=`<line x1="${RX}" y1="${ry+MH/2}" x2="${ncx+NW}" y2="${PAD+NH/2}" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>`;
  }

  // Input Guardrail
  if (hasIG){
    const ids=cfg.input_guardrails.map(g=>g.id||'guardrail').join(', ');
    els+=mkA(px,py,px,cy,'','#6b7db3');
    els+=mkN(ncx,cy,NW,NH,[i('d_igr'),ids.substring(0,22)+(ids.length>22?'…':'')],'guard');
    py=cy+NH; cy+=NH+GAP;
  }

  if (mode==='none'){
    // no target node — arrow goes directly to output section

  } else if (mode==='loadbalance'){
    const cnt=ts.length||1;
    const iw=Math.min(MW,(DW-40)/cnt-10);
    const tw=cnt*(iw+10)-10;
    const sx=mid-tw/2;
    const totW=ts.reduce((s,t)=>s+(Number(t.weight)||1),0);
    const fy=cy;
    ts.forEach((tgt,ii)=>{
      const tx=sx+ii*(iw+10), tcx=tx+iw/2;
      const wp=totW>0?Math.round(((Number(tgt.weight)||1)/totW)*100):Math.round(100/cnt);
      const lbl=(tgt.name||tgt.provider||`T${ii+1}`).replace(/^@/,'').substring(0,14);
      const mod=tgt.override_params&&tgt.override_params.model?String(tgt.override_params.model).split(/[./]/).pop():tgt.ovr_params&&tgt.ovr_params.model?String(tgt.ovr_params.model).split(/[./]/).pop().substring(0,14):'';
      els+=mkN(tx,fy,iw,NH,[lbl,`w:${tgt.weight||1}(${wp}%)${mod?'  '+mod:''}`],'primary');
      els+=`<path d="M${mid},${py} C${mid},${fy-10} ${tcx},${fy-10} ${tcx},${fy}" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>`;
    });
    const by=fy+NH; cy=by+GAP;
    ts.forEach((_,ii)=>{
      const tcx=sx+ii*(iw+10)+iw/2;
      els+=`<path d="M${tcx},${by} C${tcx},${cy-10} ${mid},${cy-10} ${mid},${cy}" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>`;
    });
    px=mid; py=cy;

  } else if (mode==='fallback'){
    const mx=mid-NW/2;
    const p0=ts[0]||({}); const p0lbl=(p0.name||p0.provider||'Primary').replace(/^@/,'').substring(0,20);
    const p0mod=p0.override_params&&p0.override_params.model?String(p0.override_params.model).split(/[./]/).pop().substring(0,18):'';
    els+=mkA(px,py,mx+NW/2,cy,'','#6b7db3');
    els+=mkN(mx,cy,NW,NH,[p0lbl,p0mod],'primary');
    px=mx+NW/2; py=cy+NH; cy+=NH+GAP;

    for (let ii=1;ii<ts.length;ii++){
      const tgt=ts[ii];
      const codes=(tgt.on_status_codes&&tgt.on_status_codes.length)?tgt.on_status_codes:(cfg.strategy&&cfg.strategy.on_status_codes)||[];
      if (codes.length){
        const cw=codes.reduce((s,c)=>s+String(c).length*7+16,0);
        els+=mkChips(px-cw/2,py+6,codes);
        els+=mkA(px,py+26,px,cy,'','#ef4444');
      } else {
        els+=mkA(px,py,px,cy,'non-2xx','#ef4444');
      }
      const lbl=(tgt.name||tgt.provider||`Fallback ${ii}`).replace(/^@/,'').substring(0,20);
      const mod=tgt.override_params&&tgt.override_params.model?String(tgt.override_params.model).split(/[./]/).pop():tgt.ovr_params&&tgt.ovr_params.model?String(tgt.ovr_params.model).split(/[./]/).pop().substring(0,18):'';
      els+=mkN(mx,cy,NW,NH,[lbl,mod],ii<ts.length-1?'primary':'warn');
      px=mx+NW/2; py=cy+NH; cy+=NH+GAP;
    }
    if (ts.length>1){
      const ex=DW-112,ey=cy-GAP-NH;
      els+=mkN(ex,ey,102,NH,i('d_err'),'danger');
      els+=`<path d="M${px},${py} C${px},${ey+NH/2} ${ex},${ey+NH/2} ${ex},${ey+NH/2}" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>`;
    }

  } else if (mode==='conditional'){
    const condArr=cfg.strategy&&cfg.strategy.conditions||[];
    const defTgt=cfg.strategy&&cfg.strategy.default||'';

    // Router box (wider)
    const rw=Math.min(300,NW+40);
    const rx2=mid-rw/2;
    const sub=`${condArr.length} ${condArr.length===1?'condition':'conditions'}${defTgt?' + default':''}`;
    els+=mkA(px,py,px,cy,'','#6b7db3');
    els+=mkN(rx2,cy,rw,NH,[i('d_cond'),sub],'cond');
    const rby=cy+NH; cy+=NH+GAP;

    // Target boxes spread across
    const cnt=Math.max(ts.length,1);
    const svgNeeded=Math.max(DW,cnt*130+40);
    const iw2=Math.min(MW,(svgNeeded-40)/cnt-10);
    const tw2=cnt*(iw2+10)-10;
    const sx2=svgNeeded/2-tw2/2;

    ts.forEach((tgt,ii)=>{
      const tx=sx2+ii*(iw2+10), tcx2=tx+iw2/2;
      const cond=condArr.find(c=>c.then===tgt.name);
      const isDef=tgt.name===defTgt;
      // Build label for arrow
      let condLbl='';
      if (cond&&cond.query){
        const [field,ops]=Object.entries(cond.query)[0]||[];
        if (ops){ const [op,val]=Object.entries(ops)[0]||[]; condLbl=`${(field||'').split('.').pop()} ${op} ${val}`; }
      } else if (isDef){ condLbl=i('d_default'); }

      // Arrow from router to target
      const rCenX=mid, arcMy=(rby+cy)/2;
      els+=`<path d="M${rCenX},${rby} C${rCenX},${arcMy} ${tcx2},${arcMy} ${tcx2},${cy}" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar)"/>`;
      // Condition label chip
      if (condLbl){
        const cw=condLbl.length*5.5+12;
        els+=`<rect x="${tcx2-cw/2}" y="${arcMy-9}" width="${cw}" height="18" rx="4" fill="#1e2536" stroke="#2a3a5b"/>
        <text x="${tcx2}" y="${arcMy+1}" fill="#7dd3fc" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${esc(condLbl)}</text>`;
      }
      const lbl2=(tgt.name||tgt.provider||`T${ii+1}`).replace(/^@/,'').substring(0,14);
      const mod2=tgt.override_params&&tgt.override_params.model?String(tgt.override_params.model).split(/[./]/).pop():tgt.ovr_params&&tgt.ovr_params.model?String(tgt.ovr_params.model).split(/[./]/).pop().substring(0,14):'';
      els+=mkN(tx,cy,iw2,NH,[lbl2,mod2],isDef?'warn':'primary');
    });

    const boty=cy+NH; cy=boty+GAP;
    const svgMid=svgNeeded/2;
    ts.forEach((_,ii)=>{
      const tcx2=sx2+ii*(iw2+10)+iw2/2;
      els+=`<path d="M${tcx2},${boty} C${tcx2},${cy-10} ${svgMid},${cy-10} ${svgMid},${cy}" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>`;
    });
    px=svgMid; py=cy;

    // Adjust SVG width for many targets
    const finalW=Math.max(DW,cnt*140+40);
    svg.setAttribute('width',finalW);

  } else {
    // single
    els+=mkA(px,py,px,cy,'','#6b7db3');
    const lbl=(ts[0]&&(ts[0].name||ts[0].provider)||'Target').replace(/^@/,'').substring(0,22);
    const mod=ts[0]&&ts[0].override_params&&ts[0].override_params.model?String(ts[0].override_params.model).split(/[./]/).pop().substring(0,18):'';
    els+=mkN(ncx,cy,NW,NH,[lbl,mod],'primary');
    px=mid; py=cy+NH; cy+=NH+GAP;
  }

  // Output Guardrail
  if (hasOG){
    const ids=cfg.output_guardrails.map(g=>g.id||'guardrail').join(', ');
    els+=mkA(px,py,mid,cy,'','#6b7db3');
    els+=mkN(mid-NW/2,cy,NW,NH,[i('d_ogr'),ids.substring(0,22)+(ids.length>22?'…':'')],'guard');
    px=mid; py=cy+NH; cy+=NH+GAP;
  }

  // Return Response
  els+=mkA(px,py,mid,cy,'','#6b7db3');
  els+=mkN(mid-NW/2,cy,NW,NH,i('d_resp'),'success');
  cy+=NH+PAD;

  const svgW = mode==='conditional' ? parseInt(svg.getAttribute('width')||DW) : DW;
  svg.setAttribute('width','100%');
  svg.setAttribute('viewBox',`0 0 ${svgW} ${cy}`);
  svg.setAttribute('height',cy);
  svg.innerHTML=els;
}

/* ════════════════════════════════════
   INIT
════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  ['rc','cbc','fb','fh'].forEach(g=>initTag(g));
  onModeChange();
  renderTargets();
  renderGRs('input');
  renderGRs('output');
  renderConds();
  applyLang();
  upd();
  dirty = false; // initial render is not a user change
  window.addEventListener('beforeunload', e => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = i('unload_msg');
  });
});
</script>
</body>
</html>
